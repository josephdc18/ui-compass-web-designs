<!doctype html>
<!--
  macbook-wallpaper.html  (3456×2160, 16:10)

  UI Compass Web Designs — desktop wallpaper, adapted from the Facebook
  cover. Same dark-green field, lockup-left / headline-right composition,
  scaled up for a 16:10 Retina canvas with extra breathing room.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Compass — Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;1,900&family=Montserrat:ital,wght@0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-green:   #0a5f3a;
    --accent:     #4fc66f;
    --cream:      #e9e9e6;
    --ink-light:  #ffffff;
    --ink-mute:   #cfd9d2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 3456px;
    height: 2160px;
    background: var(--bg-green);
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink-light);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .stage {
    position: relative;
    width: 3456px;
    height: 2160px;
    overflow: hidden;
  }

  /* Decorative cream pills bleeding off the left + right edges */
  .pill {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 540px;
    height: 1700px;
    background: var(--cream);
    border-radius: 270px;
    opacity: 0.08;
  }
  .pill.right { right: -380px; }
  .pill.left  { left:  -380px; opacity: 0.06; }

  /* Hairline rule between lockup and headline */
  .rule {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1px;
    height: 720px;
    background: rgba(255,255,255,0.16);
  }

  /* LEFT: brand lockup */
  .lockup {
    position: absolute;
    top: 50%;
    left: 1180px;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 44px;
  }
  .lockup .mark {
    width: 340px;
    height: 340px;
    display: block;
    flex: none;
  }
  .lockup .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .lockup .name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 84px;
    letter-spacing: -0.01em;
    color: var(--ink-light);
  }
  .lockup .name .dot { color: var(--accent); }
  .lockup .sub {
    margin-top: 10px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  /* RIGHT: italic headline + sub */
  .copy {
    position: absolute;
    top: 50%;
    right: 576px;
    transform: translateY(-50%);
    text-align: right;
    max-width: 1300px;
  }
  .headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 200px;
    line-height: 0.94;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: var(--ink-light);
  }
  .headline .row { display: block; white-space: nowrap; }
  .headline .accent { color: var(--accent); }

  .sub {
    margin-top: 42px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-style: italic;
    font-size: 42px;
    line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--ink-mute);
  }
  .sub .chev { margin-right: 14px; color: var(--accent); font-style: normal; font-weight: 600; }
</style>
</head>
<body>
<main class="stage">
  <div class="pill left"  aria-hidden="true"></div>
  <div class="pill right" aria-hidden="true"></div>
  <div class="rule" aria-hidden="true"></div>

  <div class="lockup">
    <img class="mark" src="../src/assets/logo-on-dark.svg" alt="UI Compass Web Designs">
    <div class="wordmark">
      <span class="name">UI Compass<span class="dot">.</span></span>
      <span class="sub">Web Designs</span>
    </div>
  </div>

  <div class="copy">
    <h1 class="headline">
      <span class="row">FASTER <span class="accent">SITES.</span></span>
      <span class="row">MORE <span class="accent">CALLS.</span></span>
    </h1>
    <p class="sub"><span class="chev">&gt;&gt;</span>Hand-coded websites for DFW small businesses.</p>
  </div>
</main>
</body>
</html>
