<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — The 1-Second Tax (Dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:#0d1411; --bg-2:#1a221d;
    --cream:#2a2e25; --primary:#00bd74; --primary-l:#00bd74;
    --header:#fafbfc; --body:rgba(250,251,252,0.75); --muted:rgba(250,251,252,0.45);
    --hairline:rgba(250,251,252,0.20);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg-1);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 24px 56px 22px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 92% 110%, rgba(0,189,116,0.16), transparent 60%),
      radial-gradient(700px 600px at -8% -10%, rgba(0,189,116,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.10; z-index: 1; }

  /* === Unified top strip === */
  .strip {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 18px;
  }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 17px; color: var(--header); }

  /* === Body === */
  .body { position: relative; z-index: 3; flex: 1; padding-top: 8px; display: flex; flex-direction: column; min-height: 0; }

  .stat-row { display: flex; align-items: baseline; gap: 18px; max-width: 920px; }
  .stat { font-weight: 900; font-size: 280px; line-height: 0.9; letter-spacing: -0.045em; color: var(--primary); }
  .unit { font-weight: 700; font-size: 64px; letter-spacing: -0.02em; color: var(--header); }

  .caption {
    margin-top: 14px;
    font-weight: 800;
    font-size: 52px; line-height: 1.06; letter-spacing: -0.02em;
    color: var(--header); max-width: 720px;
  }
  .caption em { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; color: var(--primary); }

  /* === Stopwatch decoration === */
  .stopwatch { position: absolute; right: 56px; bottom: 100px; width: 260px; height: 280px; pointer-events: none; z-index: 2; filter: drop-shadow(0 22px 44px rgba(0,0,0,0.55)); }
  .stopwatch svg { width: 100%; height: 100%; display: block; }

  /* === Unified footer === */
  .foot {
    position: relative; z-index: 3;
    padding-top: 12px; margin-top: 12px;
    border-top: 1px solid var(--hairline);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; filter: brightness(0) invert(1); opacity: 0.92; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 19px; color: var(--header); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .foot-meta { font-size: 11px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--header); }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">

  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 0.98  0 0 0 0.45 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="strip">
    <span class="rule"></span>
    <span class="issue">Issue Nº 15 · February 2026</span>
  </div>

  <section class="body">
    <div class="stat-row">
      <div class="stat">7%</div>
    </div>

    <p class="caption">Of potential customers, <em>lost</em> for every second your site takes to load.</p>

    <div class="stopwatch" aria-hidden="true">
      <svg viewBox="0 0 260 280" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="face" cx="50%" cy="42%" r="62%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#faf7f4"/>
            <stop offset="100%" stop-color="#ece4d4"/>
          </radialGradient>
        </defs>

        <!-- Crown (top button) -->
        <rect x="120" y="0" width="20" height="14" rx="2" fill="#1f1c19"/>
        <rect x="116" y="12" width="28" height="10" rx="3" fill="#1f1c19"/>

        <!-- Bezel ring -->
        <circle cx="130" cy="148" r="120" fill="#1f1c19"/>
        <circle cx="130" cy="148" r="112" fill="#0e0d0a"/>

        <!-- Face -->
        <circle cx="130" cy="148" r="106" fill="url(#face)"/>

        <!-- 60 minute ticks: thin, faint -->
        <g stroke="rgba(250,251,252,0.22)" stroke-width="1" stroke-linecap="round">
          <line x1="130" y1="48" x2="130" y2="54"/>
          <g transform="rotate(6 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(12 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(18 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(24 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(36 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(42 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(48 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(54 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(66 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(72 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(78 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(84 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(96 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(102 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(108 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(114 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(126 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(132 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(138 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(144 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(156 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(162 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(168 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(174 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(186 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(192 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(198 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(204 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(216 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(222 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(228 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(234 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(246 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(252 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(258 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(264 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(276 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(282 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(288 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(294 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(306 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(312 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(318 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(324 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(336 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(342 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(348 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
          <g transform="rotate(354 130 148)"><line x1="130" y1="48" x2="130" y2="54"/></g>
        </g>

        <!-- 5-second major ticks (12 of them) -->
        <g stroke="#1f1c19" stroke-width="2.5" stroke-linecap="round">
          <line x1="130" y1="46" x2="130" y2="62"/>
          <g transform="rotate(30 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(60 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(90 130 148)"><line x1="130" y1="46" x2="130" y2="62"/></g>
          <g transform="rotate(120 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(150 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(180 130 148)"><line x1="130" y1="46" x2="130" y2="62"/></g>
          <g transform="rotate(210 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(240 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(270 130 148)"><line x1="130" y1="46" x2="130" y2="62"/></g>
          <g transform="rotate(300 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
          <g transform="rotate(330 130 148)"><line x1="130" y1="46" x2="130" y2="58"/></g>
        </g>

        <!-- Numerals 0 / 15 / 30 / 45 -->
        <g font-family="Roboto, sans-serif" font-size="14" font-weight="700" fill="#1f1c19">
          <text x="130" y="86"  text-anchor="middle">0</text>
          <text x="198" y="153" text-anchor="middle">15</text>
          <text x="130" y="222" text-anchor="middle">30</text>
          <text x="62"  y="153" text-anchor="middle">45</text>
        </g>

        <!-- 1-second mark — small green pip + label, just past 12 o'clock (6°) -->
        <g transform="rotate(6 130 148)">
          <line x1="130" y1="44" x2="130" y2="64" stroke="#00bd74" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="146" y="60" font-family="Roboto, sans-serif" font-size="12" font-weight="800" fill="#00bd74">1s</text>

        <!-- Second hand: pointed just past the 1s mark to show the tax has triggered -->
        <g transform="rotate(11 130 148)">
          <line x1="130" y1="148" x2="130" y2="64" stroke="#00bd74" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="130" y1="148" x2="130" y2="170" stroke="#00bd74" stroke-width="3.5" stroke-linecap="round"/>
        </g>

        <!-- Center hub -->
        <circle cx="130" cy="148" r="8" fill="#1f1c19"/>
        <circle cx="130" cy="148" r="4" fill="#00bd74"/>
      </svg>
    </div>
  </section>

  <div class="foot">
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="foot-meta">Performance<span class="dot">•</span>6 min read</div>
  </div>

</main>
</body>
</html>
