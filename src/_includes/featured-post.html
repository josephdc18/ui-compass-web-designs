<div class="blog-sidebar">
  <div class="blog-featured-group">
    <span class="blog-header">Featured Posts</span>
    {%- for post in collections.featured | reverse -%}
    <a class="featured-card" href="{{ post.url }}">
      {% if post.data.image %}
      <picture class="featured-card-image">
        <img src="{{ post.data.image }}" alt="{{ post.data.imageAlt | default(post.data.blogTitle) }}" width="600" height="360" decoding="async" loading="lazy" />
      </picture>
      {% endif %}
      <div class="featured-card-body">
        {% if post.data.topper %}
        <span class="featured-card-topper">
          <span class="featured-card-dot" aria-hidden="true"></span>
          {{ post.data.topper }}
        </span>
        {% endif %}
        <h3 class="featured-card-title">{{ post.data.blogTitle }}</h3>
        <span class="featured-card-date">{{ post.date | postDate }}</span>
      </div>
    </a>
    {%- endfor -%}
  </div>
</div>
