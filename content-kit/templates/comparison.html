<!doctype html>
<!--
  comparison.html
  Use for: head-to-head versus posts. WordPress vs hand-coded, page builder vs custom,
  hosting vs maintenance vs support, DIY vs pro, mobile-first vs desktop-first.
  Massive italic Playfair "vs" mark anchors the center while two columns of stats
  sit on either side. Right column is intentionally bigger and emerald to signal
  the winner at a glance — swap which side gets that treatment per post.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comparison Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base:        #faf7f4;
    --bg-base-2:      #f3ede5;
    --primary:        #006940;
    --primary-light:  #00bd74;
    --cream:          #e6d9c7;
    --cream-deep:     #d6c4a8;
    --text:           #262421;
    --text-body:      #4e4b66;
    --text-muted:     #7a7889;
    --text-faint:     #b3a995;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: var(--bg-base);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(900px 700px at 85% -10%, rgba(0, 105, 64, 0.08), transparent 60%),
      radial-gradient(700px 600px at -10% 110%, rgba(0, 105, 64, 0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-base-2) 100%);
  }

  /* === Background flourish === */
  .arc { position: absolute; border-radius: 50%; pointer-events: none; }
  .arc-tr-outer { top: -260px; right: -260px; width: 640px; height: 640px; border: 1px solid rgba(0, 105, 64, 0.16); }
  .arc-tr-inner { top: -180px; right: -180px; width: 480px; height: 480px; border: 1px solid rgba(0, 105, 64, 0.10); }
  .arc-bl { bottom: -240px; left: -240px; width: 540px; height: 540px; border: 1px solid rgba(0, 105, 64, 0.12); }

  .dot-pair {
    position: absolute; width: 9px;
    display: flex; flex-direction: column; gap: 9px;
    pointer-events: none; z-index: 3;
  }
  .dot-pair span {
    display: block; width: 9px; height: 9px;
    border-radius: 50%; background: var(--primary);
  }
  .dot-pair span:nth-child(2) { background: rgba(0, 105, 64, 0.32); }
  .dot-tl { top: 56px; left: 64px; }
  .dot-bl { bottom: 60px; left: 64px; }

  /* === HERO === */
  .hero {
    position: relative; z-index: 2;
    padding: 124px 96px 0;
    text-align: center;
  }
  .pill-eyebrow {
    display: inline-block;
    padding: 11px 24px;
    background: rgba(0, 105, 64, 0.08);
    border: 1px solid rgba(0, 105, 64, 0.32);
    border-radius: 999px;
    color: var(--primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.34em; text-transform: uppercase;
  }
  .headline {
    margin-top: 30px;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-size: 84px; line-height: 1.02;
    font-weight: 600; letter-spacing: -0.02em;
    color: var(--text);
  }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }
  .subhead {
    margin-top: 22px;
    font-size: 22px; line-height: 1.4;
    color: var(--text-body); letter-spacing: 0.01em;
  }
  .subhead em {
    font-family: 'Playfair Display', serif;
    font-style: italic; color: var(--primary); font-weight: 500;
  }
  .stripe {
    margin: 28px auto 0;
    display: flex; gap: 6px;
    justify-content: center; width: 220px;
  }
  .stripe span { flex: 1; height: 5px; border-radius: 3px; }
  .stripe span:nth-child(1) { background: var(--primary); }
  .stripe span:nth-child(2) { background: var(--cream-deep); }
  .stripe span:nth-child(3) { background: var(--primary-light); }

  /* === VERSUS BLOCK === */
  .versus {
    position: relative;
    z-index: 2;
    margin-top: 60px;
    padding: 32px 80px 28px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* Giant Playfair "vs" mark anchored dead-center, behind everything */
  .vs-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 280px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: rgba(0, 105, 64, 0.08);
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  /* Side headers — losing side muted, winning side emerald */
  .vs-headers {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: baseline;
  }
  .vs-headers .side {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    line-height: 1.1;
    font-weight: 500;
  }
  .vs-headers .left {
    text-align: right;
    padding-right: 80px;
    color: var(--text-muted);
    font-style: normal;
  }
  .vs-headers .right {
    text-align: left;
    padding-left: 80px;
    color: var(--primary);
    font-style: italic;
    font-weight: 600;
  }

  /* Comparison rows */
  .vs-row {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .vs-label {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
  }
  .vs-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    align-items: baseline;
  }
  .vs-pair .left, .vs-pair .right {
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-style: italic;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .vs-pair .left {
    text-align: right;
    padding-right: 80px;
    font-size: 56px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .vs-pair .right {
    text-align: left;
    padding-left: 80px;
    font-size: 76px;
    font-weight: 600;
    color: var(--primary);
  }
  .vs-pair .unit {
    font-style: italic;
    font-weight: 500;
    font-size: 0.55em;
    color: inherit;
    margin-left: 2px;
  }

  /* Verdict line */
  .vs-verdict {
    position: relative;
    z-index: 1;
    margin-top: 16px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 26px;
    line-height: 1.3;
    color: var(--text);
    letter-spacing: 0.005em;
  }
  .vs-verdict strong {
    font-weight: 600;
    color: var(--primary);
    font-style: italic;
  }

  /* Decorative hairline above the verdict */
  .vs-rule {
    position: relative;
    z-index: 1;
    margin: 14px auto 0;
    width: 56%;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(0, 105, 64, 0.32),
      transparent);
  }

  /* === FOOTER === */
  .footer {
    position: relative; z-index: 2;
    margin-top: auto;
    padding: 0 80px 50px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 32px; height: 32px; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-size: 18px; font-weight: 700; color: var(--text); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub {
    margin-top: 4px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .meta { text-align: right; line-height: 1.4; }
  .meta .url {
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-body);
  }
  .meta .date {
    margin-top: 3px;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 14px; font-weight: 500;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<main class="canvas">

  <div class="arc arc-tr-outer"></div>
  <div class="arc arc-tr-inner"></div>
  <div class="arc arc-bl"></div>

  <div class="dot-pair dot-tl"><span></span><span></span></div>
  <div class="dot-pair dot-bl"><span></span><span></span></div>

  <section class="hero">
    <div class="pill-eyebrow">Comparison</div>
    <h1 class="headline">WordPress<br>vs <em>Hand-Coded</em></h1>
    <p class="subhead">Same job. <em>Very different result.</em></p>
    <div class="stripe"><span></span><span></span><span></span></div>
  </section>

  <section class="versus">
    <span class="vs-mark">vs</span>

    <div class="vs-headers">
      <div class="side left">WordPress</div>
      <div class="side right">Hand-Coded</div>
    </div>

    <div class="vs-row">
      <div class="vs-label">Load Time</div>
      <div class="vs-pair">
        <span class="left">6.2<i class="unit">s</i></span>
        <span class="right">0.8<i class="unit">s</i></span>
      </div>
    </div>

    <div class="vs-row">
      <div class="vs-label">PageSpeed Score</div>
      <div class="vs-pair">
        <span class="left">64</span>
        <span class="right">100</span>
      </div>
    </div>

    <div class="vs-row">
      <div class="vs-label">Plugins to Maintain</div>
      <div class="vs-pair">
        <span class="left">22</span>
        <span class="right">0</span>
      </div>
    </div>

    <div class="vs-row">
      <div class="vs-label">Build Time</div>
      <div class="vs-pair">
        <span class="left">6<i class="unit">wks</i></span>
        <span class="right">14<i class="unit">days</i></span>
      </div>
    </div>

    <div class="vs-rule"></div>
    <p class="vs-verdict">Same audience. <strong>Different result.</strong></p>
  </section>

  <footer class="footer">
    <div class="brand">
      <img src="../assets/logo.svg" alt="UI Compass">
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="meta">
      <div class="url">uicompasswebdesigns.com</div>
      <div class="date">May 9, 2026</div>
    </div>
  </footer>

</main>
</body>
</html>
