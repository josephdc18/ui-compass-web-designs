<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Anatomy of a Homepage (Dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:#0d1411; --bg-2:#1a221d;
    --cream:#2a2e25; --cream-deep:rgba(250,251,252,0.30);
    --primary:#00bd74; --primary-l:#00bd74;
    --header:#fafbfc; --body:rgba(250,251,252,0.75); --muted:rgba(250,251,252,0.45);
    --hairline:rgba(250,251,252,0.20);
    --line-soft:rgba(250,251,252,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg-1);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 24px 56px 22px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 92% 110%, rgba(0,189,116,0.16), transparent 60%),
      radial-gradient(700px 600px at -8% -10%, rgba(0,189,116,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.10; z-index: 1; }

  /* === Unified top strip === */
  .strip {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 18px;
  }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 17px; color: var(--header); }

  /* === Body === */
  .body {
    position: relative; z-index: 3; flex: 1;
    padding-top: 20px;
    display: grid; grid-template-columns: 500px 1fr;
    gap: 28px; align-items: stretch; min-height: 0;
  }

  .hero { display: flex; flex-direction: column; padding-top: 8px; min-width: 0; }
  .headline {
    font-family: "Playfair Display", "Times New Roman", serif;
    font-size: 76px; line-height: 1.0;
    font-weight: 600; letter-spacing: -0.02em;
    color: var(--header);
  }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }
  .subhead { margin-top: 18px; font-size: 21px; line-height: 1.4; color: var(--body); max-width: 460px; }
  .subhead em { font-family: "Playfair Display", serif; font-style: italic; color: var(--primary); font-weight: 500; }
  .stripe { margin-top: 22px; display: flex; gap: 6px; width: 180px; }
  .stripe span { flex: 1; height: 5px; border-radius: 3px; }
  .stripe span:nth-child(1) { background: var(--primary); }
  .stripe span:nth-child(2) { background: var(--cream-deep); }
  .stripe span:nth-child(3) { background: var(--primary-l); }

  /* === Anatomy diagram === */
  .anatomy { position: relative; width: 100%; height: 100%; min-height: 0; }
  .anatomy::before {
    content: ""; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 320px; height: 380px;
    background: radial-gradient(closest-side, rgba(0,189,116,0.16), transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .phone-wrap {
    position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 180px; height: 360px; z-index: 2;
    filter: drop-shadow(0 22px 44px rgba(0,0,0,0.55));
  }
  .phone-wrap svg { display: block; width: 100%; height: 100%; }
  .connectors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .connectors path { fill: none; stroke: var(--primary); stroke-width: 1.6; stroke-linecap: round; opacity: 0.55; }
  .connectors circle { fill: var(--primary); opacity: 0.85; }
  .callout { position: absolute; width: 220px; display: flex; align-items: center; gap: 14px; z-index: 3; }
  .callout .num {
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 600;
    font-size: 60px; line-height: 0.9; letter-spacing: -0.025em;
    color: var(--primary); flex: none;
    text-shadow: 0 3px 10px rgba(0,189,116,0.16);
  }
  .callout .label { font-size: 15px; font-weight: 700; color: var(--header); line-height: 1.2; letter-spacing: -0.005em; }
  .callout.tl, .callout.bl { flex-direction: row-reverse; }
  .callout.tl .label, .callout.bl .label { text-align: right; }
  .callout.tr .label, .callout.br .label { text-align: left; }
  .callout.tl { top: 4px;   left: 0; }
  .callout.tr { top: 4px;   right: 0; }
  .callout.bl { bottom: 4px; left: 0; }
  .callout.br { bottom: 4px; right: 0; }

  /* === Unified footer === */
  .foot {
    position: relative; z-index: 3;
    padding-top: 12px; margin-top: 12px;
    border-top: 1px solid var(--hairline);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; filter: brightness(0) invert(1); opacity: 0.92; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 19px; color: var(--header); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .foot-meta { font-size: 11px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--header); }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">

  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 0.98  0 0 0 0.45 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="strip">
    <span class="rule"></span>
    <span class="issue">Issue Nº 37 · June 2026</span>
  </div>

  <section class="body">

    <div class="hero">
      <h1 class="headline">What turns a visitor<br>into a <em>customer</em>.</h1>
      <p class="subhead">Four things people look for on your homepage, <em>in the first three seconds.</em></p>
      <div class="stripe"><span></span><span></span><span></span></div>
    </div>

    <div class="anatomy">

      <svg class="connectors" viewBox="0 0 720 476" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 280 100 C 220 92, 180 78, 130 60"/><circle cx="130" cy="60" r="3"/>
        <path d="M 440 145 C 510 130, 555 90, 595 60"/><circle cx="595" cy="60" r="3"/>
        <path d="M 280 320 C 220 360, 180 400, 130 420"/><circle cx="130" cy="420" r="3"/>
        <path d="M 440 350 C 510 380, 555 405, 595 420"/><circle cx="595" cy="420" r="3"/>
      </svg>

      <div class="phone-wrap">
        <svg viewBox="0 0 180 360" aria-hidden="true">
          <rect x="0" y="0" width="180" height="360" rx="26" fill="#3a3530"/>
          <rect x="5" y="5" width="170" height="350" rx="22" fill="#1a1814"/>
          <rect x="9" y="9" width="162" height="342" rx="18" fill="#faf7f4"/>
          <rect x="68" y="5" width="44" height="11" rx="5.5" fill="#1a1814"/>

          <rect x="18" y="24" width="144" height="18" rx="4" fill="#e6d9c7" opacity="0.8"/>
          <circle cx="28" cy="33" r="3.5" fill="#00bd74"/>
          <rect x="38" y="29" width="34" height="7" rx="2" fill="#1f1c19" opacity="0.7"/>

          <rect x="18" y="56" width="120" height="11" rx="3" fill="#1f1c19" opacity="0.92"/>
          <rect x="18" y="71" width="90"  height="11" rx="3" fill="#1f1c19" opacity="0.92"/>
          <rect x="18" y="90" width="140" height="6" rx="2" fill="#4e4b66" opacity="0.55"/>
          <rect x="18" y="100" width="120" height="6" rx="2" fill="#4e4b66" opacity="0.55"/>
          <circle cx="18" cy="68" r="5" fill="#00bd74"/>
          <circle cx="18" cy="68" r="8" fill="none" stroke="#00bd74" stroke-width="1.3" opacity="0.5"/>

          <rect x="18" y="118" width="78" height="24" rx="12" fill="#00bd74"/>
          <rect x="34" y="126" width="46" height="7" rx="2" fill="#faf7f4"/>
          <circle cx="162" cy="130" r="5" fill="#00bd74"/>
          <circle cx="162" cy="130" r="8" fill="none" stroke="#00bd74" stroke-width="1.3" opacity="0.5"/>
          <line x1="96" y1="130" x2="154" y2="130" stroke="#00bd74" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

          <rect x="18" y="154" width="144" height="70" rx="5" fill="#d6c4a8" opacity="0.5"/>
          <circle cx="90" cy="189" r="11" fill="none" stroke="#00bd74" stroke-width="1.3" opacity="0.6"/>
          <path d="M 87 184 L 87 195 L 95 189 Z" fill="#00bd74" opacity="0.6"/>

          <rect x="18" y="234" width="144" height="48" rx="5" fill="#e6d9c7" opacity="0.4"/>
          <text x="26" y="251" font-family="Inter, Roboto, sans-serif" font-size="8" font-weight="700" fill="#1f1c19">★★★★★ 4.9</text>
          <rect x="26" y="258" width="120" height="4" rx="1.5" fill="#4e4b66" opacity="0.45"/>
          <rect x="26" y="266" width="100" height="4" rx="1.5" fill="#4e4b66" opacity="0.45"/>
          <rect x="26" y="274" width="44"  height="3" rx="1" fill="#1f1c19" opacity="0.6"/>
          <circle cx="18" cy="258" r="5" fill="#00bd74"/>
          <circle cx="18" cy="258" r="8" fill="none" stroke="#00bd74" stroke-width="1.3" opacity="0.5"/>

          <rect x="18" y="294" width="144" height="26" rx="5" fill="#00bd74" opacity="0.14"/>
          <circle cx="34" cy="307" r="6" fill="none" stroke="#00bd74" stroke-width="1.3"/>
          <path d="M 31 304 Q 31 310, 36 310" fill="none" stroke="#00bd74" stroke-width="1.3" stroke-linecap="round"/>
          <rect x="46" y="300" width="62" height="5" rx="1.5" fill="#00bd74" opacity="0.85"/>
          <rect x="46" y="309" width="44" height="4" rx="1.5" fill="#00bd74" opacity="0.55"/>
          <circle cx="162" cy="307" r="5" fill="#00bd74"/>
          <circle cx="162" cy="307" r="8" fill="none" stroke="#00bd74" stroke-width="1.3" opacity="0.5"/>

          <rect x="68" y="338" width="44" height="3" rx="1.5" fill="#1f1c19" opacity="0.4"/>
        </svg>
      </div>

      <div class="callout tl"><div class="num">01</div><div class="label">A clear promise</div></div>
      <div class="callout tr"><div class="num">02</div><div class="label">One action button</div></div>
      <div class="callout bl"><div class="num">03</div><div class="label">Real reviews</div></div>
      <div class="callout br"><div class="num">04</div><div class="label">Click to call</div></div>

    </div>
  </section>

  <div class="foot">
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="foot-meta">Strategy<span class="dot">•</span>5 min read</div>
  </div>

</main>
</body>
</html>
