<!doctype html>
<!--
  blog-card-ladder.html  (1200×630)  ──  Unified shell, ladder/staircase template

  Use for: posts that frame a maturity model / step-up / progress chart with
  5 ascending stages. The visualization is a bar chart that climbs left to
  right; the top stage is filled green with the others paper-toned + outlined.

  Tokens to fill:
    {{ISSUE}}                       — "Issue Nº XX · Month YYYY"
    {{HEADLINE}}                    — Playfair italic display. Em accent.
    {{SUBHEAD}}                     — Roboto 21px deck.
    {{S1_LABEL}} … {{S5_LABEL}}     — short small-caps stage names
                                      (e.g. "TRANSLATED", "LOCALIZED")
    {{AXIS_L}}                      — bottom-left muted axis label
                                      (e.g. "ENGLISH ONLY")
    {{AXIS_R}}                      — bottom-right green axis label
                                      (e.g. "FULLY BILINGUAL")
    {{FOOTER}}                      — "Section · X min read"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-1:#f7f2ea; --bg-2:#efe7d8; --cream:#e6d9c7; --cream-deep:#d6c4a8; --primary:#006940; --primary-l:#00bd74; --header:#1f1c19; --body:#4e4b66; --muted:#8a8474; --hairline:rgba(31,28,25,0.22); --line-soft:rgba(31,28,25,0.12); }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg-1); font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif; color: var(--header); overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .card { position: relative; width: 1200px; height: 630px; padding: 24px 56px 22px; display: flex; flex-direction: column; background: radial-gradient(900px 700px at 92% 110%, rgba(0,105,64,0.10), transparent 60%), radial-gradient(700px 600px at -8% -10%, rgba(230,217,199,0.55), transparent 60%), linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%); overflow: hidden; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: 0.18; z-index: 1; }
  .strip { position: relative; z-index: 3; display: flex; align-items: center; gap: 18px; }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 17px; color: var(--header); }
  .body { position: relative; z-index: 3; flex: 1; padding-top: 24px; display: grid; grid-template-columns: 480px 1fr; gap: 36px; align-items: center; min-height: 0; }
  .hero { display: flex; flex-direction: column; min-width: 0; }
  .headline { font-family: "Playfair Display", "Times New Roman", serif; font-weight: 600; font-size: 72px; line-height: 1.02; letter-spacing: -0.022em; color: var(--header); }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }
  .subhead { margin-top: 18px; font-size: 21px; line-height: 1.4; color: var(--body); max-width: 440px; }
  .stripe { margin-top: 24px; display: flex; gap: 6px; width: 180px; }
  .stripe span { flex: 1; height: 5px; border-radius: 3px; }
  .stripe span:nth-child(1) { background: var(--primary); }
  .stripe span:nth-child(2) { background: var(--cream-deep); }
  .stripe span:nth-child(3) { background: var(--primary-l); }
  .ladder { width: 100%; max-width: 640px; margin-left: auto; }
  .ladder svg { width: 100%; height: auto; display: block; }
  .foot { position: relative; z-index: 3; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--hairline); display: flex; align-items: flex-end; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 19px; color: var(--header); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .foot-meta { font-size: 11px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--header); }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0.55 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="strip"><span class="rule"></span><span class="issue">{{ISSUE}}</span></div>
  <section class="body">
    <div class="hero">
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="subhead">{{SUBHEAD}}</p>
      <div class="stripe"><span></span><span></span><span></span></div>
    </div>
    <div class="ladder" role="img" aria-label="Five ascending stages">
      <svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#00bd74"/>
            <stop offset="100%" stop-color="#006940"/>
          </linearGradient>
        </defs>

        <!-- Ground rule -->
        <line x1="20" y1="390" x2="620" y2="390" stroke="rgba(31,28,25,0.18)" stroke-width="1.2"/>

        <!-- Stage 1 -->
        <rect x="40"  y="324" width="100" height="66"  rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(31,28,25,0.22)" stroke-width="1.4"/>
        <text x="90"  y="313" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="26" fill="#8a8474">01</text>
        <text x="90"  y="364" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">{{S1_LABEL}}</text>

        <!-- Stage 2 -->
        <rect x="160" y="276" width="100" height="114" rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(31,28,25,0.22)" stroke-width="1.4"/>
        <text x="210" y="265" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="30" fill="#8a8474">02</text>
        <text x="210" y="340" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">{{S2_LABEL}}</text>

        <!-- Stage 3 -->
        <rect x="280" y="222" width="100" height="168" rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(31,28,25,0.22)" stroke-width="1.4"/>
        <text x="330" y="211" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="34" fill="#8a8474">03</text>
        <text x="330" y="312" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">{{S3_LABEL}}</text>

        <!-- Stage 4 -->
        <rect x="400" y="162" width="100" height="228" rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(31,28,25,0.22)" stroke-width="1.4"/>
        <text x="450" y="151" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="38" fill="#8a8474">04</text>
        <text x="450" y="280" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">{{S4_LABEL}}</text>

        <!-- Stage 5 — active green -->
        <rect x="520" y="92" width="100" height="298" rx="6" fill="url(#active)" stroke="#006940" stroke-width="1.4"/>
        <text x="570" y="82" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="42" fill="#006940">05</text>
        <text x="570" y="248" text-anchor="middle" font-family="Roboto" font-weight="800" font-size="13" letter-spacing="2.6" fill="#faf7f4">{{S5_LABEL}}</text>

        <!-- Axis labels -->
        <text x="40"  y="416" font-family="Roboto" font-weight="700" font-size="10" letter-spacing="2" fill="#8a8474">{{AXIS_L}}</text>
        <text x="620" y="416" text-anchor="end" font-family="Roboto" font-weight="700" font-size="10" letter-spacing="2" fill="#006940">{{AXIS_R}}</text>
      </svg>
    </div>
  </section>
  <div class="foot">
    <div class="brand"><img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo><div class="wordmark"><span class="name">UI Compass<span class="dot">.</span></span><span class="sub">Web Designs</span></div></div>
    <div class="foot-meta">{{FOOTER}}</div>
  </div>
</main>
</body>
</html>
