<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Folio — A Scroll-Jacked Two-Column Portfolio Reel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Geist served as a variable font (wght axis 100..900) — required for the "wght" interpolation -->
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* Theme tokens */
    :root {
      --background: #0e0c0a;
      --foreground: #f5efe2;
      --muted:      #6c655a;
      --subtle:     #1a1612;
    }

    html, body { margin: 0; padding: 0; }
    body {
      background: var(--background);
      color: var(--foreground);
      font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }
    .font-mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

    /* Theme utility shims for Tailwind CDN */
    .bg-background { background-color: var(--background); }
    .bg-subtle     { background-color: var(--subtle); }
    .text-foreground { color: var(--foreground); }
    .text-muted      { color: var(--muted); }
    .border-foreground\/15 { border-color: color-mix(in srgb, var(--foreground) 15%, transparent); }

    *, *::before, *::after { box-sizing: border-box; }
    img { -webkit-user-drag: none; user-select: none; }

    /* Variable font defaults */
    h1, h2, h3, p, span { font-variation-settings: "wght" 420; }
  </style>
</head>
<body>
  <section
    id="folio"
    class="relative h-screen w-full overflow-hidden bg-background"
  >
    <!-- ───── Chrome: top-left label ───── -->
    <div
      data-chrome
      class="absolute left-8 top-8 z-20 flex items-center gap-3 lg:left-12 lg:top-12"
      style="opacity: 0;"
    >
      <span class="font-mono text-[10px] uppercase tracking-[0.32em] text-muted">Selected Work</span>
      <span class="block h-px w-8 bg-foreground/15"></span>
    </div>

    <!-- ───── Chrome: top-right counter ───── -->
    <div
      data-chrome
      class="absolute right-8 top-8 z-20 flex items-center gap-3 lg:right-12 lg:top-12"
      style="opacity: 0;"
    >
      <span class="block h-px w-8 bg-foreground/15"></span>
      <span class="font-mono text-[10px] uppercase tracking-[0.32em] text-muted tabular-nums">
        <span id="folio-counter-current">01</span>
        <span class="text-foreground/40"> / </span>
        <span id="folio-counter-total">09</span>
      </span>
    </div>

    <!-- ───── Chrome: bottom-left scroll prompt ───── -->
    <div
      data-chrome
      class="absolute bottom-8 left-8 z-20 flex items-center gap-3 lg:bottom-12 lg:left-12"
      style="opacity: 0;"
    >
      <span class="font-mono text-[10px] uppercase tracking-[0.32em] text-muted">Scroll</span>
      <span class="block h-px w-12 bg-foreground/15"></span>
      <span id="folio-discipline" class="font-mono text-[10px] uppercase tracking-[0.32em] text-foreground/85">FILM</span>
    </div>

    <!-- ───── LEFT — title strip (clipped above midline) ───── -->
    <div
      class="absolute left-0 z-[1] w-1/2 overflow-hidden"
      style="top: 50vh; height: 50vh;"
    >
      <div id="folio-titles" class="absolute inset-x-0 top-0 will-change-transform"></div>
    </div>

    <!-- ───── RIGHT — image strip (no clip; neighbours peek) ───── -->
    <div class="absolute right-0 top-0 h-screen w-1/2">
      <div id="folio-images" class="absolute inset-x-0 top-0 will-change-transform"></div>
    </div>
  </section>

  <script>
  (function () {
    "use strict";

    /* ─────────────────────────────────────────────────────────
       § 8 — DATA
       ───────────────────────────────────────────────────────── */
    const ITEMS = [
      { id: "atlas",      title: "Atlas Unfolds",        client: "GUSTAFSON STUDIO", year: "2024", discipline: "FILM",      imageId: "1596956708072-8ca0c2973887", imagePosition: "center 35%" },
      { id: "blueprint",  title: "Blueprint No. 7",      client: "OFFICE M.",         year: "2024", discipline: "DIRECTION", imageId: "1610847455028-9e55e62bac33", imagePosition: "center 40%" },
      { id: "wherelight", title: "Where Light Breaks",   client: "FOREST PRESS",      year: "2024", discipline: "EDITORIAL", imageId: "1615374744335-dd8adbd9e3e9", imagePosition: "center 30%" },
      { id: "ember",      title: "Ember & Ash",          client: "MAISON H.",         year: "2025", discipline: "CAMPAIGN",  imageId: "1636766812350-c2842e8c6b76", imagePosition: "center 45%" },
      { id: "longquiet",  title: "The Long Quiet",       client: "CARMEL ARCHIVE",    year: "2024", discipline: "FILM",      imageId: "1633885274919-04b5af171f8c", imagePosition: "center 35%" },
      { id: "cavern",     title: "Cavern",               client: "STONE & SOUND",     year: "2022", discipline: "MOTION",    imageId: "1665426520283-33b35e81bbc7", imagePosition: "center 50%" },
      { id: "coastal",    title: "Coastal Drift",        client: "LITTORAL CO.",      year: "2023", discipline: "EDITORIAL", imageId: "1500964757637-c85e8a162699", imagePosition: "center 40%" },
      { id: "afterrain",  title: "After the Rain",       client: "VAGUE BUREAU",      year: "2025", discipline: "DIRECTION", imageId: "1469474968028-56623f02e42e", imagePosition: "center 45%" },
      { id: "northquiet", title: "North of Quiet",       client: "BOREAL FILMS",      year: "2024", discipline: "FILM",      imageId: "1518837695005-2083093ee35b", imagePosition: "center 35%" },
    ];
    const N = ITEMS.length; // 9

    /* ─────────────────────────────────────────────────────────
       § 2 — CONSTANTS
       ───────────────────────────────────────────────────────── */
    const TITLE_VISIBLE_COUNT = 7;
    const TITLE_AREA_VH       = 50;
    const TITLE_SLOT_VH       = TITLE_AREA_VH / TITLE_VISIBLE_COUNT;       // ≈ 7.143
    const IMAGE_HEIGHT_VH     = 60;
    const IMAGE_GAP_VH        = 5;
    const IMAGE_PITCH_VH      = IMAGE_HEIGHT_VH + IMAGE_GAP_VH;            // 65
    const SCROLL_PER_ITEM_VH  = 75;
    const SMOOTHING           = 0.14;

    /* ─────────────────────────────────────────────────────────
       BUILDERS
       ───────────────────────────────────────────────────────── */
    function htmlEscape(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function imgUrl(id) {
      return "https://images.unsplash.com/photo-" + id + "?w=900&h=1125&fit=crop&q=80&auto=format";
    }

    function titleRowHtml(item, i) {
      return (
        '<div data-title="' + i + '" class="flex items-baseline gap-4 px-12 lg:px-16" ' +
              'style="height:' + TITLE_SLOT_VH + 'vh;">' +
          '<h3 class="leading-none tracking-[-0.015em]" ' +
              'style="font-size: clamp(1.05rem, 3.4vh, 2.1rem);">' + htmlEscape(item.title) + '</h3>' +
          '<span data-subtitle="' + i + '" ' +
                'class="hidden sm:inline font-mono text-[10px] uppercase tracking-[0.22em] text-muted whitespace-nowrap" ' +
                'style="opacity:0;">' +
            htmlEscape(item.client) + ' · ' + htmlEscape(item.discipline) + ' · ' + htmlEscape(item.year) +
          '</span>' +
        '</div>'
      );
    }

    function imageRowHtml(item, i) {
      const isVideo = !!item.videoSrc;
      const objectPosition = item.imagePosition || "center";
      const mediaTag = isVideo
        ? '<video src="' + item.videoSrc + '" muted loop playsinline preload="metadata" ' +
                'class="absolute inset-0 h-full w-full" ' +
                'style="object-fit:cover; object-position:' + objectPosition + ';"></video>'
        : '<img src="' + imgUrl(item.imageId) + '" alt="" loading="eager" decoding="async" draggable="false" ' +
               'class="absolute inset-0 h-full w-full" ' +
               'style="object-fit:cover; object-position:' + objectPosition + ';">';

      return (
        '<div class="flex items-center justify-center" style="height:' + IMAGE_PITCH_VH + 'vh;">' +
          '<div data-slot="' + i + '" ' +
                'class="relative overflow-hidden rounded-2xl bg-subtle shadow-[0_30px_70px_-30px_rgba(0,0,0,0.55)]" ' +
                'style="height:' + IMAGE_HEIGHT_VH + 'vh; aspect-ratio: 4 / 5; opacity:0; transform:scale(0.84);">' +
            '<div data-inner="' + i + '" class="absolute inset-0">' +
              mediaTag +
            '</div>' +
            '<div class="pointer-events-none absolute inset-0" ' +
                  'style="background:linear-gradient(to top, rgba(0,0,0,0.12), rgba(0,0,0,0) 40%, rgba(0,0,0,0));"></div>' +
          '</div>' +
        '</div>'
      );
    }

    /* ─────────────────────────────────────────────────────────
       BUILD
       ───────────────────────────────────────────────────────── */
    const sectionEl     = document.getElementById("folio");
    const titlesStripEl = document.getElementById("folio-titles");
    const imagesStripEl = document.getElementById("folio-images");
    const counterCur    = document.getElementById("folio-counter-current");
    const counterTot    = document.getElementById("folio-counter-total");
    const disciplineEl  = document.getElementById("folio-discipline");

    titlesStripEl.innerHTML = ITEMS.map(titleRowHtml).join("");
    imagesStripEl.innerHTML = ITEMS.map(imageRowHtml).join("");
    counterTot.textContent = String(N).padStart(2, "0");

    // Cache per-item refs
    const titleRefs    = ITEMS.map(function (_, i) { return titlesStripEl.querySelector('[data-title="' + i + '"]'); });
    const subtitleRefs = ITEMS.map(function (_, i) { return titlesStripEl.querySelector('[data-subtitle="' + i + '"]'); });
    const slotRefs     = ITEMS.map(function (_, i) { return imagesStripEl.querySelector('[data-slot="' + i + '"]'); });
    const innerRefs    = ITEMS.map(function (_, i) { return imagesStripEl.querySelector('[data-inner="' + i + '"]'); });
    const videoRefs    = ITEMS.map(function (_, i) {
      const inner = innerRefs[i];
      return inner ? inner.querySelector("video") : null;
    });

    /* ─────────────────────────────────────────────────────────
       § 5 — SMOOTHING + § 4 — POSITION MATH
       ───────────────────────────────────────────────────────── */
    let pos        = 0;
    let targetPos  = 0;
    let activeIdx  = 0;
    let raf        = 0;
    let entranceComplete = false;

    function applyPositions() {
      const vh = window.innerHeight / 100;

      // Strip translations
      titlesStripEl.style.transform =
        "translate3d(0," + (-pos * TITLE_SLOT_VH * vh).toFixed(2) + "px, 0)";
      imagesStripEl.style.transform =
        "translate3d(0," + ((50 - IMAGE_PITCH_VH / 2 - pos * IMAGE_PITCH_VH) * vh).toFixed(2) + "px, 0)";

      // Per-item writes
      for (let i = 0; i < N; i++) {
        const dist = Math.abs(i - pos);

        // Image slot — opacity + scale (piecewise)
        let opacity, scale;
        if (dist < 1)      { const t = 1 - dist;        opacity = 0.78 + 0.22 * t; scale = 0.93 + 0.07 * t; }
        else if (dist < 2) { const t = 1 - (dist - 1);  opacity = 0.18 + 0.60 * t; scale = 0.84 + 0.09 * t; }
        else               { opacity = 0.18; scale = 0.84; }

        const slot = slotRefs[i];
        if (slot && entranceComplete) {
          slot.style.opacity   = opacity.toFixed(3);
          slot.style.transform = "scale(" + scale.toFixed(4) + ")";
        }

        // Title — color + weight
        const t  = Math.max(0, 1 - dist * 0.55);
        const wght = 420 + 200 * t;
        const titleH3 = titleRefs[i] ? titleRefs[i].firstElementChild : null;
        if (titleH3) {
          titleH3.style.color = "color-mix(in srgb, var(--foreground) " + (t * 100).toFixed(1) + "%, var(--muted))";
          titleH3.style.fontVariationSettings = '"wght" ' + wght.toFixed(0);
          titleH3.style.fontWeight = String(Math.round(wght));
        }

        // Subtitle — tighter falloff
        const t2 = Math.max(0, 1 - dist * 2.8);
        const sub = subtitleRefs[i];
        if (sub) {
          sub.style.opacity   = t2.toFixed(3);
          sub.style.transform = "translateX(" + ((1 - t2) * -10).toFixed(2) + "px)";
        }
      }
    }

    function tick() {
      // Smoothing
      pos = Math.abs(targetPos - pos) < 0.0005
        ? targetPos
        : pos + (targetPos - pos) * SMOOTHING;

      applyPositions();

      const rounded = Math.max(0, Math.min(N - 1, Math.round(pos)));
      if (rounded !== activeIdx) {
        activeIdx = rounded;
        onActiveChange(rounded);
      }

      raf = requestAnimationFrame(tick);
    }

    /* ─────────────────────────────────────────────────────────
       § 7 — ACTIVE-ONLY MOTION
       ───────────────────────────────────────────────────────── */
    function onActiveChange(idx) {
      // Counter + bottom discipline
      counterCur.textContent = String(idx + 1).padStart(2, "0");
      disciplineEl.textContent = ITEMS[idx].discipline;

      // Ken-Burns — kill all, restart on active, gently reset others
      for (let i = 0; i < N; i++) {
        const el = innerRefs[i];
        if (!el) continue;
        gsap.killTweensOf(el);
        if (i === idx) {
          gsap.fromTo(
            el,
            { scale: 1.0, x: 0, y: 0 },
            { scale: 1.08, x: -10, y: -14, duration: 7, ease: "sine.inOut", yoyo: true, repeat: -1 }
          );
        } else {
          gsap.to(el, { scale: 1.0, x: 0, y: 0, duration: 0.5, ease: "power2.out" });
        }
      }

      // Video play state
      for (let i = 0; i < N; i++) {
        const v = videoRefs[i];
        if (!v) continue;
        if (i === idx) {
          const p = v.play();
          if (p && typeof p.catch === "function") p.catch(function () {});
        } else {
          v.pause();
          try { v.currentTime = 0; } catch (_) {}
        }
      }
    }

    /* ─────────────────────────────────────────────────────────
       § 6 — SCROLLTRIGGER PIN
       ───────────────────────────────────────────────────────── */
    gsap.registerPlugin(ScrollTrigger);

    ScrollTrigger.create({
      trigger:    sectionEl,
      start:      "top top",
      end:        "+=" + ((N - 1) * SCROLL_PER_ITEM_VH) + "vh",
      pin:        true,
      pinSpacing: true,
      onUpdate:   function (self) { targetPos = self.progress * (N - 1); },
    });

    /* ─────────────────────────────────────────────────────────
       § 9 — ENTRANCE
       ───────────────────────────────────────────────────────── */
    // Pre-set initial entrance state on the strips so the first paint matches
    gsap.set([titlesStripEl, imagesStripEl], { opacity: 0, y: 36, scale: 1.05, filter: "blur(14px)" });

    // Pre-paint the static positions so the entrance reveals real content (not a blank page)
    applyPositions();

    gsap.fromTo(
      [titlesStripEl, imagesStripEl],
      { opacity: 0, y: 36, scale: 1.05, filter: "blur(14px)" },
      {
        opacity: 1, y: 0, scale: 1, filter: "blur(0px)",
        duration: 1.4, ease: "power4.out", stagger: 0.12, delay: 0.1,
        onComplete: function () {
          entranceComplete = true;
          // Now let per-frame writes own the slot opacity/scale
          applyPositions();
          // Kick off the active item's Ken-Burns + (any) video
          onActiveChange(activeIdx);
        },
      }
    );

    gsap.fromTo(
      sectionEl.querySelectorAll("[data-chrome]"),
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.9, ease: "power3.out", stagger: 0.06, delay: 0.6 }
    );

    /* ─────────────────────────────────────────────────────────
       Boot
       ───────────────────────────────────────────────────────── */
    raf = requestAnimationFrame(tick);

    // Recompute on resize so vh-based math stays consistent
    window.addEventListener("resize", function () {
      applyPositions();
      ScrollTrigger.refresh();
    });

    // Cleanup if the page navigates away (defensive)
    window.addEventListener("pagehide", function () {
      cancelAnimationFrame(raf);
    });
  })();
  </script>
</body>
</html>
