<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — AI-Built Websites (Dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-1:#0d1411; --bg-2:#1a221d; --cream:#2a2e25; --primary:#00bd74; --primary-l:#00bd74; --header:#fafbfc; --body:rgba(250,251,252,0.75); --muted:rgba(250,251,252,0.45); --hairline:rgba(250,251,252,0.20); --line-soft:rgba(250,251,252,0.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg-1); font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif; color: var(--header); overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .card { position: relative; width: 1200px; height: 630px; padding: 24px 56px 22px; display: flex; flex-direction: column; background: radial-gradient(900px 700px at 92% 110%, rgba(0,189,116,0.16), transparent 60%), radial-gradient(700px 600px at -8% -10%, rgba(0,189,116,0.06), transparent 60%), linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%); overflow: hidden; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.10; z-index: 1; }
  .strip { position: relative; z-index: 3; display: flex; align-items: center; gap: 18px; }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 17px; color: var(--header); }

  .body { position: relative; z-index: 3; flex: 1; padding: 18px 0 0; display: flex; flex-direction: column; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  .topbar .pill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; background: rgba(0,189,116,0.08); border: 1px solid rgba(0,189,116,0.32); border-radius: 999px; color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; }
  .topbar .rule { flex: 1; height: 1px; background: var(--line-soft); }
  .topbar .right { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 16px; color: var(--body); }

  .headline { margin-top: 14px; font-family: "Playfair Display", "Times New Roman", serif; font-size: 50px; line-height: 1.04; font-weight: 600; letter-spacing: -0.02em; color: var(--header); }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }

  .cols { margin-top: 14px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 22px; align-items: stretch; flex: 1; min-height: 0; }
  .col { padding: 16px 22px 14px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; min-height: 0; }
  .col.l { background: rgba(250,251,252,0.04); border: 1px solid var(--line-soft); }
  .col.r { background: rgba(0,189,116,0.07); border: 1px solid rgba(0,189,116,0.30); }
  .col.r::after { content: "✓"; position: absolute; top: 10px; right: 14px; font-weight: 900; font-size: 20px; color: var(--primary); }
  .col .label { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); align-self: flex-start; }
  .col.r .label { color: var(--primary); }
  .col .device { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding: 4px 0; min-height: 0; }
  .col .device svg { display: block; max-height: 100%; max-width: 100%; width: auto; height: auto; }
  .col .measure { font-weight: 900; font-size: 28px; letter-spacing: -0.02em; color: var(--header); line-height: 1; }
  .col.r .measure { color: var(--primary); }
  .col .desc { font-size: 13px; line-height: 1.35; color: var(--body); text-align: center; max-width: 320px; }
  .vs { display: flex; align-items: center; justify-content: center; font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 28px; color: var(--muted); padding: 0 4px; }

  .foot { position: relative; z-index: 3; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--hairline); display: flex; align-items: flex-end; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; filter: brightness(0) invert(1); opacity: 0.92; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 19px; color: var(--header); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .foot-meta { font-size: 11px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--header); }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 0.98  0 0 0 0.45 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>

  <div class="strip"><span class="rule"></span><span class="issue">Issue Nº 38 · June 2026</span></div>

  <h1 class="headline">Can AI build your <em>website</em>?</h1>

  <div class="cols">

    <div class="col l">
      <div class="label">AI alone</div>
      <div class="device">
        <!-- Draft browser — wireframe state -->
        <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Browser frame -->
          <rect x="6" y="6" width="308" height="208" rx="8" fill="#1f1c19"/>
          <rect x="14" y="14" width="292" height="192" rx="4" fill="#faf7f4"/>
          <!-- Browser chrome -->
          <rect x="14" y="14" width="292" height="26" fill="#e9e4dc"/>
          <circle cx="28" cy="27" r="4" fill="#d6a3a3"/>
          <circle cx="42" cy="27" r="4" fill="#d6c4a8"/>
          <circle cx="56" cy="27" r="4" fill="#a8c8a3"/>
          <rect x="80" y="20" width="180" height="14" rx="3" fill="#f7f2ea"/>
          <!-- Robot icon in URL bar -->
          <rect x="86" y="23" width="9" height="8" rx="1.5" fill="#8a8474"/>
          <circle cx="89" cy="26" r="1" fill="#faf7f4"/>
          <circle cx="92" cy="26" r="1" fill="#faf7f4"/>
          <rect x="100" y="25" width="80" height="4" rx="1" fill="#8a8474" opacity="0.5"/>

          <!-- Wireframe content (gray blocks, no real polish) -->
          <rect x="32" y="58" width="120" height="14" rx="2" fill="#c9c4ba"/>
          <rect x="32" y="80" width="90" height="10" rx="2" fill="#d8d3c9"/>
          <rect x="32" y="98" width="160" height="6" rx="1.5" fill="#e0dccf"/>
          <rect x="32" y="112" width="140" height="6" rx="1.5" fill="#e0dccf"/>
          <rect x="32" y="126" width="100" height="6" rx="1.5" fill="#e0dccf"/>

          <!-- Generic "button" -->
          <rect x="32" y="146" width="80" height="22" rx="3" fill="#c9c4ba"/>

          <!-- Image placeholder with cross-out X -->
          <rect x="210" y="58" width="76" height="76" rx="3" fill="#e9e4dc" stroke="#c9c4ba" stroke-width="1"/>
          <line x1="216" y1="64" x2="280" y2="128" stroke="#c9c4ba" stroke-width="1"/>
          <line x1="280" y1="64" x2="216" y2="128" stroke="#c9c4ba" stroke-width="1"/>

          <!-- Three "issue" marks in red — alt text missing, contrast, form -->
          <g>
            <circle cx="24" cy="62" r="5" fill="#b03b21"/>
            <text x="24" y="65.5" text-anchor="middle" font-family="Roboto" font-size="8" font-weight="900" fill="#faf7f4">!</text>
          </g>
          <g>
            <circle cx="24" cy="100" r="5" fill="#b03b21"/>
            <text x="24" y="103.5" text-anchor="middle" font-family="Roboto" font-size="8" font-weight="900" fill="#faf7f4">!</text>
          </g>
          <g>
            <circle cx="24" cy="155" r="5" fill="#b03b21"/>
            <text x="24" y="158.5" text-anchor="middle" font-family="Roboto" font-size="8" font-weight="900" fill="#faf7f4">!</text>
          </g>

          <!-- Form fields broken indication -->
          <rect x="32" y="178" width="120" height="14" rx="2" fill="none" stroke="#c9c4ba" stroke-width="1" stroke-dasharray="3 2"/>
        </svg>
      </div>
      <div class="measure">60% draft</div>
      <div class="desc">Layout and copy in 15 minutes. Accessibility, SEO, and forms still broken.</div>
    </div>

    <div class="vs">vs.</div>

    <div class="col r">
      <div class="label">AI plus human</div>
      <div class="device">
        <!-- Polished browser — production state -->
        <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Browser frame -->
          <rect x="6" y="6" width="308" height="208" rx="8" fill="#1f1c19"/>
          <rect x="14" y="14" width="292" height="192" rx="4" fill="#faf7f4"/>
          <!-- Browser chrome -->
          <rect x="14" y="14" width="292" height="26" fill="#e9e4dc"/>
          <circle cx="28" cy="27" r="4" fill="#d6a3a3"/>
          <circle cx="42" cy="27" r="4" fill="#d6c4a8"/>
          <circle cx="56" cy="27" r="4" fill="#a8c8a3"/>
          <rect x="80" y="20" width="180" height="14" rx="3" fill="#f7f2ea"/>
          <!-- Lock icon (SSL) -->
          <rect x="86" y="22" width="6" height="9" rx="1" fill="#00bd74"/>
          <rect x="84" y="25" width="10" height="7" rx="1.5" fill="#00bd74"/>
          <rect x="100" y="25" width="80" height="4" rx="1" fill="#1f1c19" opacity="0.6"/>

          <!-- Polished content with real hierarchy -->
          <rect x="32" y="58" width="140" height="14" rx="2" fill="#1f1c19"/>
          <rect x="32" y="80" width="100" height="10" rx="2" fill="#4e4b66"/>
          <rect x="32" y="98" width="160" height="6" rx="1.5" fill="#4e4b66" opacity="0.6"/>
          <rect x="32" y="112" width="140" height="6" rx="1.5" fill="#4e4b66" opacity="0.6"/>
          <rect x="32" y="126" width="100" height="6" rx="1.5" fill="#4e4b66" opacity="0.6"/>

          <!-- Real green CTA button -->
          <rect x="32" y="146" width="80" height="22" rx="3" fill="#00bd74"/>
          <rect x="44" y="153" width="56" height="8" rx="1.5" fill="#faf7f4"/>

          <!-- Image with alt-text indicator -->
          <rect x="210" y="58" width="76" height="76" rx="3" fill="#d6c4a8"/>
          <circle cx="248" cy="92" r="10" fill="none" stroke="#00bd74" stroke-width="1.4"/>
          <path d="M 244 87 L 244 97 L 252 92 Z" fill="#00bd74"/>

          <!-- Three green check marks — accessibility, SEO, fast -->
          <g>
            <circle cx="24" cy="62" r="5" fill="#00bd74"/>
            <path d="M 21.5 62 L 23.5 64 L 27 60.5" stroke="#faf7f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
          <g>
            <circle cx="24" cy="100" r="5" fill="#00bd74"/>
            <path d="M 21.5 100 L 23.5 102 L 27 98.5" stroke="#faf7f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
          <g>
            <circle cx="24" cy="155" r="5" fill="#00bd74"/>
            <path d="M 21.5 155 L 23.5 157 L 27 153.5" stroke="#faf7f4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>

          <!-- Working form field -->
          <rect x="32" y="178" width="120" height="14" rx="2" fill="none" stroke="#1f1c19" stroke-width="1"/>
          <rect x="36" y="182" width="40" height="6" rx="1.5" fill="#1f1c19" opacity="0.5"/>
        </svg>
      </div>
      <div class="measure">100% shipped</div>
      <div class="desc">Accessibility, local SEO, real speed, working forms. The other 40%.</div>
    </div>

  </div>

  <div class="foot">
    <div class="brand"><img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo><div class="wordmark"><span class="name">UI Compass<span class="dot">.</span></span><span class="sub">Web Designs</span></div></div>
    <div class="foot-meta">Strategy<span class="dot">•</span>6 min read</div>
  </div>
</main>
</body>
</html>
