<!doctype html>
<!--
  scorecard.html
  Use for: proof posts. PageSpeed, Lighthouse, accessibility audit, any 4-up
  score showcase. Each ring renders the actual score as a filled arc — drop in
  the percentage and the visual updates. Italic Playfair numerals in the center
  for that editorial-magazine feel.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorecard Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base:        #faf7f4;
    --bg-base-2:      #f3ede5;
    --bg-card:        #ffffff;
    --primary:        #006940;
    --primary-light:  #00bd74;
    --cream:          #e6d9c7;
    --cream-deep:     #d6c4a8;
    --text:           #262421;
    --text-body:      #4e4b66;
    --text-muted:     #7a7889;
    --text-faint:     #b3a995;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: var(--bg-base);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(900px 700px at 85% -10%, rgba(0, 105, 64, 0.08), transparent 60%),
      radial-gradient(700px 600px at -10% 110%, rgba(0, 105, 64, 0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-base-2) 100%);
  }

  /* === Background flourish === */
  .arc { position: absolute; border-radius: 50%; pointer-events: none; }
  .arc-tr-outer { top: -260px; right: -260px; width: 640px; height: 640px; border: 1px solid rgba(0, 105, 64, 0.16); }
  .arc-tr-inner { top: -180px; right: -180px; width: 480px; height: 480px; border: 1px solid rgba(0, 105, 64, 0.10); }
  .arc-bl { bottom: -240px; left: -240px; width: 540px; height: 540px; border: 1px solid rgba(0, 105, 64, 0.12); }

  .dot-pair {
    position: absolute; width: 9px;
    display: flex; flex-direction: column; gap: 9px;
    pointer-events: none; z-index: 3;
  }
  .dot-pair span {
    display: block; width: 9px; height: 9px;
    border-radius: 50%; background: var(--primary);
  }
  .dot-pair span:nth-child(2) { background: rgba(0, 105, 64, 0.32); }
  .dot-tl { top: 56px; left: 64px; }
  .dot-bl { bottom: 60px; left: 64px; }

  /* === HERO === */
  .hero {
    position: relative; z-index: 2;
    padding: 130px 96px 0;
    text-align: center;
  }
  .pill-eyebrow {
    display: inline-block;
    padding: 11px 24px;
    background: rgba(0, 105, 64, 0.08);
    border: 1px solid rgba(0, 105, 64, 0.32);
    border-radius: 999px;
    color: var(--primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.34em; text-transform: uppercase;
  }
  .headline {
    margin-top: 30px;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-size: 90px; line-height: 1.02;
    font-weight: 600; letter-spacing: -0.02em;
    color: var(--text);
  }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }
  .subhead {
    margin-top: 24px;
    font-size: 22px; line-height: 1.4;
    color: var(--text-body); letter-spacing: 0.01em;
  }
  .subhead em {
    font-family: 'Playfair Display', serif;
    font-style: italic; color: var(--primary); font-weight: 500;
  }
  .stripe {
    margin: 30px auto 0;
    display: flex; gap: 6px;
    justify-content: center; width: 220px;
  }
  .stripe span { flex: 1; height: 5px; border-radius: 3px; }
  .stripe span:nth-child(1) { background: var(--primary); }
  .stripe span:nth-child(2) { background: var(--cream-deep); }
  .stripe span:nth-child(3) { background: var(--primary-light); }

  /* === SCORE RINGS === */
  .scores {
    position: relative; z-index: 2;
    margin-top: 56px;
    padding: 0 110px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 36px 60px;
  }
  .score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .ring-wrap {
    position: relative;
    width: 220px; height: 220px;
  }
  .ring-wrap svg {
    width: 100%; height: 100%;
    display: block;
    filter: drop-shadow(0 8px 18px rgba(0, 105, 64, 0.10));
  }
  .ring-track {
    fill: none;
    stroke: rgba(0, 105, 64, 0.14);
    stroke-width: 3;
  }
  .ring-fill {
    fill: none;
    stroke: var(--primary);
    stroke-width: 7;
    stroke-linecap: round;
    /* circumference 2*pi*96 = ~603.19 */
    stroke-dasharray: 603.19;
    transform-origin: 110px 110px;
    transform: rotate(-90deg);
  }
  /* Score-specific dashoffset = 603.19 * (1 - score/100) */
  .ring-fill.s-100 { stroke-dashoffset: 0; }
  .ring-fill.s-98  { stroke-dashoffset: 12.06; }
  .ring-fill.s-95  { stroke-dashoffset: 30.16; }
  .ring-fill.s-90  { stroke-dashoffset: 60.32; }

  /* End-of-arc accent dot — only visible for non-100 scores */
  .ring-cap {
    fill: var(--primary);
    stroke: var(--bg-base);
    stroke-width: 2;
  }

  .ring-num {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', 'Times New Roman', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 84px;
    line-height: 1;
    color: var(--primary);
    letter-spacing: -0.025em;
  }

  .score-label {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text);
  }

  /* === CAPTION === */
  .caption {
    position: relative; z-index: 2;
    margin: 36px 110px 0;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    line-height: 1.4;
    color: var(--text);
  }
  .caption strong {
    font-weight: 600;
    color: var(--primary);
  }

  /* === FOOTER === */
  .footer {
    position: relative; z-index: 2;
    margin-top: auto;
    padding: 0 80px 50px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 32px; height: 32px; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-size: 18px; font-weight: 700; color: var(--text); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub {
    margin-top: 4px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .meta { text-align: right; line-height: 1.4; }
  .meta .url {
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-body);
  }
  .meta .date {
    margin-top: 3px;
    font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 14px; font-weight: 500;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<main class="canvas">

  <div class="arc arc-tr-outer"></div>
  <div class="arc arc-tr-inner"></div>
  <div class="arc arc-bl"></div>

  <div class="dot-pair dot-tl"><span></span><span></span></div>
  <div class="dot-pair dot-bl"><span></span><span></span></div>

  <section class="hero">
    <div class="pill-eyebrow">Proof</div>
    <h1 class="headline">Receipts.<br>Not <em>Promises.</em></h1>
    <p class="subhead">Latest mobile PageSpeed audit, <em>real client homepage.</em></p>
    <div class="stripe"><span></span><span></span><span></span></div>
  </section>

  <section class="scores">

    <div class="score">
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="96"/>
          <circle class="ring-fill s-98" cx="110" cy="110" r="96"/>
        </svg>
        <div class="ring-num">98</div>
      </div>
      <div class="score-label">Performance</div>
    </div>

    <div class="score">
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="96"/>
          <circle class="ring-fill s-100" cx="110" cy="110" r="96"/>
        </svg>
        <div class="ring-num">100</div>
      </div>
      <div class="score-label">Accessibility</div>
    </div>

    <div class="score">
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="96"/>
          <circle class="ring-fill s-100" cx="110" cy="110" r="96"/>
        </svg>
        <div class="ring-num">100</div>
      </div>
      <div class="score-label">Best Practices</div>
    </div>

    <div class="score">
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="96"/>
          <circle class="ring-fill s-100" cx="110" cy="110" r="96"/>
        </svg>
        <div class="ring-num">100</div>
      </div>
      <div class="score-label">SEO</div>
    </div>

  </section>

  <p class="caption">All four metrics. <strong>Live client homepage.</strong> Run yours at <strong>pagespeed.web.dev</strong>.</p>

  <footer class="footer">
    <div class="brand">
      <img src="../assets/logo.svg" alt="UI Compass">
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="meta">
      <div class="url">uicompasswebdesigns.com</div>
      <div class="date">May 9, 2026</div>
    </div>
  </footer>

</main>
</body>
</html>
