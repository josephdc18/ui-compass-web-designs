<!doctype html>
<!--
  blog-card-stat.html  (1200×630)
  Use for: posts anchored on a single number ("$120/mo", "8.5s", "$8K").
  Tokens:
    {{EYEBROW}}   — small caps tag, e.g. "Strategy · Costs"
    {{STAT}}      — the number itself, accent-colored. Use <span class="ink">…</span>
                    inside to mix accent + dark ink (e.g. "$8K" → "$" gold, "8K" dark).
    {{UNIT}}      — small unit/qualifier next to stat (e.g. "/ mo." or "s"). Optional.
    {{CAPTION}}   — short bold sentence under the stat, ends with a period.
    {{FOOTER}}    — small caps meta line.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Stat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f4; --bg-2: #f3ede5;
    --cream: #e6d9c7; --primary: #006940; --primary-light: #00bd74;
    --header: #262421; --body: #4e4b66; --muted: #7a7889;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 48px 64px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 600px at 110% 110%, rgba(0,105,64,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 14px;
    font-size: 15px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--primary);
  }
  .eyebrow::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); flex: none; }

  .stat-row {
    margin-top: 28px;
    display: flex; align-items: baseline; gap: 18px;
    max-width: 820px;
  }
  .stat {
    font-weight: 900;
    font-size: 230px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    color: var(--primary);
  }
  .stat .ink { color: var(--header); }
  .unit {
    font-weight: 700;
    font-size: 64px;
    letter-spacing: -0.02em;
    color: var(--header);
  }

  .caption {
    margin-top: 18px;
    font-weight: 900;
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--header);
    max-width: 820px;
  }

  .foot {
    margin-top: auto;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .foot-meta {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--body);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 38px; height: 38px; flex: none; display: block; }
  .brand .name { font-size: 18px; font-weight: 700; color: var(--header); letter-spacing: -0.01em; }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }

  /* Orbit decoration bottom-right */
  .orbit {
    position: absolute; right: 60px; bottom: 110px;
    width: 220px; height: 220px; pointer-events: none;
  }
  .orbit svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<main class="card">

  <div class="eyebrow">{{EYEBROW}}</div>

  <div class="stat-row">
    <div class="stat">{{STAT}}</div>
    <div class="unit">{{UNIT}}</div>
  </div>

  <p class="caption">{{CAPTION}}</p>

  <div class="orbit" aria-hidden="true">
    <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="110" cy="110" r="100" stroke="#006940" stroke-width="1.5" opacity="0.45"/>
      <circle cx="110" cy="110" r="70"  stroke="#006940" stroke-width="1.5" opacity="0.35"/>
      <circle cx="110" cy="110" r="40"  stroke="#006940" stroke-width="1.5" opacity="0.28"/>
      <circle cx="208" cy="105" r="8"   fill="#006940"/>
      <circle cx="68"  cy="200" r="8"   fill="#006940"/>
      <circle cx="160" cy="170" r="6"   fill="#00bd74"/>
    </svg>
  </div>

  <div class="foot">
    <div class="foot-meta">{{FOOTER}}</div>
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
  </div>

</main>
</body>
</html>
