<!doctype html>
<!--
  blog-card-audit-checklist-light.html  (1200×630)  ──  Audit-pad — light field

  Same structure as blog-card-audit-checklist.html, in the wallpaper aesthetic
  flipped to a cool paper-white field (faintly green-tinted, not cream).
  Pad is a pure-white card on the pale sage field with deep-green ink.

  Tokens to fill (same interface as the cream + dark versions):
    {{ISSUE}}                — "Issue Nº XX · Month YYYY"
    {{HEADLINE}}             — Barlow Condensed italic 900. Wrap accent
                               words in <em>…</em>.
    {{SUBHEAD}}              — Montserrat italic deck, ~20px. <em>…</em>
                               for the green accent.
    {{KICKER}}               — pad header eyebrow (e.g. "Mobile Audit").
    {{STAMP}}                — pad header right-side stamp.
    {{R1_NAME}} {{R1_VAL}}   — row name + right-aligned value
    {{R2_NAME}} {{R2_VAL}}
    {{R3_NAME}} {{R3_VAL}}   — repeat row blocks as needed
    {{FOOT_LABEL}}           — pad footer small-caps label
    {{FOOT_VALUE}}           — pad footer value
    {{FOOTER}}               — "Section · X min read"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Audit Checklist (Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,500;1,700;1,900&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-paper:    #f4f7f3;
    --bg-paper-d:  #e3e9e2;
    --bg-soft:     #f8faf7;
    --surface:     #ffffff;
    --surface-2:   #eaefe8;
    --accent:      #0a5f3a;
    --accent-l:    #4fc66f;
    --accent-d:    #084e30;
    --ink-dark:    #142019;
    --ink-mid:     #3d4a42;
    --ink-mute:    #6a7a70;
    --ink-soft:    #8f9c92;
    --hairline:    rgba(10,32,25,0.22);
    --line-soft:   rgba(10,32,25,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body {
    width: 1200px; height: 630px;
    background: var(--bg-paper);
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--ink-dark);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 24px 56px 22px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 92% 110%, rgba(10,95,58,0.10), transparent 60%),
      radial-gradient(700px 600px at -8% -10%, rgba(79,198,111,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-soft) 0%, var(--bg-paper-d) 100%);
    overflow: hidden;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none;
    mix-blend-mode: multiply; opacity: 0.14; z-index: 1;
  }

  /* Decorative green pill blooms */
  .pill {
    position: absolute;
    background: var(--accent);
    border-radius: 200px;
    pointer-events: none;
    z-index: 0;
  }
  .pill.left  { top: 50%; transform: translateY(-50%); left:  -240px; width: 320px; height: 560px; opacity: 0.06; }
  .pill.right { top: 50%; transform: translateY(-50%); right: -240px; width: 320px; height: 560px; opacity: 0.05; }

  /* Top strip */
  .strip {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 18px;
  }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue {
    font-family: "Montserrat", sans-serif;
    font-weight: 600; font-size: 12px;
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--ink-mid);
  }
  .strip .chev {
    font-family: "Montserrat", sans-serif;
    font-weight: 700; color: var(--accent);
    font-size: 14px; letter-spacing: -0.05em;
  }

  /* Two-column body */
  .body {
    position: relative; z-index: 3;
    flex: 1; padding-top: 24px;
    display: grid; grid-template-columns: 480px 1fr; gap: 36px;
    align-items: center; min-height: 0;
  }
  .hero { display: flex; flex-direction: column; min-width: 0; }
  .headline {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 900; font-style: italic;
    font-size: 84px; line-height: 0.94;
    letter-spacing: -0.005em; text-transform: uppercase;
    color: var(--ink-dark);
  }
  .headline em { font-style: italic; font-weight: 900; color: var(--accent); }
  .subhead {
    margin-top: 18px;
    font-family: "Montserrat", sans-serif;
    font-style: italic; font-weight: 400;
    font-size: 20px; line-height: 1.45;
    color: var(--ink-mid); max-width: 440px;
  }
  .subhead em { font-style: italic; font-weight: 500; color: var(--accent); }

  .stripe { margin-top: 24px; display: flex; gap: 6px; width: 180px; }
  .stripe span { flex: 1; height: 5px; border-radius: 3px; }
  .stripe span:nth-child(1) { background: var(--accent); }
  .stripe span:nth-child(2) { background: var(--surface-2); }
  .stripe span:nth-child(3) { background: var(--accent-l); }

  /* Audit pad — pure white surface on cool paper field */
  .pad {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 22px 26px 20px;
    box-shadow:
      0 18px 36px rgba(20,32,25,0.14),
      0 2px 6px rgba(20,32,25,0.06);
    display: flex; flex-direction: column;
    transform: rotate(0.6deg);
  }
  .pad-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line-soft);
  }
  .pad-head .kicker {
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.30em; text-transform: uppercase;
    color: var(--accent);
    display: flex; align-items: center; gap: 8px;
  }
  .pad-head .kicker::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
  }
  .pad-head .stamp {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-style: italic; font-weight: 700;
    font-size: 16px; letter-spacing: 0.005em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .items { display: flex; flex-direction: column; }
  .item {
    display: grid; grid-template-columns: 36px 1fr auto;
    align-items: center; gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .item:last-of-type { border-bottom: none; }
  .check {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px rgba(10,95,58,0.30);
  }
  .check svg { width: 18px; height: 18px; display: block; }
  .item .name {
    font-family: "Montserrat", sans-serif;
    font-size: 21px; font-weight: 700;
    color: var(--ink-dark);
    letter-spacing: -0.01em;
  }
  .item .val {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-style: italic; font-weight: 700;
    font-size: 18px; letter-spacing: 0.005em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .pad-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--line-soft);
  }
  .pad-foot .label {
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.30em; text-transform: uppercase;
    color: var(--ink-dark);
  }
  .pad-foot .total {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-style: italic; font-weight: 900;
    font-size: 26px; letter-spacing: -0.005em;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* Foot */
  .foot {
    position: relative; z-index: 3;
    padding-top: 12px; margin-top: 16px;
    border-top: 1px solid var(--hairline);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name {
    font-family: "Montserrat", sans-serif;
    font-weight: 700; font-size: 18px;
    letter-spacing: -0.005em;
    color: var(--ink-dark);
  }
  .brand .name .dot { color: var(--accent); }
  .brand .sub {
    margin-top: 4px; font-size: 10px;
    font-weight: 600; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--ink-mute);
  }
  .foot-meta {
    font-family: "Montserrat", sans-serif;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--ink-dark);
  }
  .foot-meta .dot { color: var(--accent); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.08  0 0 0 0 0.13  0 0 0 0 0.10  0 0 0 0.5 0"/></filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="pill left"  aria-hidden="true"></div>
  <div class="pill right" aria-hidden="true"></div>

  <div class="strip">
    <span class="rule"></span>
    <span class="chev">&gt;&gt;</span>
    <span class="issue">{{ISSUE}}</span>
  </div>

  <section class="body">
    <div class="hero">
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="subhead">{{SUBHEAD}}</p>
      <div class="stripe"><span></span><span></span><span></span></div>
    </div>

    <div class="pad" role="img" aria-label="Audit pad with checked items">
      <div class="pad-head">
        <div class="kicker">{{KICKER}}</div>
        <div class="stamp">{{STAMP}}</div>
      </div>
      <div class="items">
        <div class="item">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="name">{{R1_NAME}}</div>
          <div class="val">{{R1_VAL}}</div>
        </div>
        <div class="item">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="name">{{R2_NAME}}</div>
          <div class="val">{{R2_VAL}}</div>
        </div>
        <div class="item">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="name">{{R3_NAME}}</div>
          <div class="val">{{R3_VAL}}</div>
        </div>
      </div>
      <div class="pad-foot">
        <div class="label">{{FOOT_LABEL}}</div>
        <div class="total">{{FOOT_VALUE}}</div>
      </div>
    </div>
  </section>

  <div class="foot">
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="foot-meta">{{FOOTER}}</div>
  </div>
</main>
</body>
</html>
