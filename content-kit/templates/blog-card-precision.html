<!doctype html>
<!--
  blog-card-precision.html  (1200×630)
  Scandinavian-minimal × Apple-HIG. Negative space, tight Inter Display headline,
  JetBrains-Mono micro-labels, a precision compass dial as the anchor.

  Tokens:
    {{HEADLINE}}     — set lowercase, end with a period. Wrap accented word in
                       <span class="ink">…</span> to flip its color to brand green.
    {{DECK}}         — single-line subhead under the headline. Quiet, declarative.
    {{TOPIC}}        — value for the TOPIC spec column (e.g. "Performance").
    {{DURATION}}     — value for the DURATION spec column (e.g. "6 min").
    {{PUBLISHED}}    — value for the PUBLISHED spec column (e.g. "2026.05.10").
    {{ISSUE}}        — top-right label, e.g. "UI Compass / Nº 23".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:      #f7f4ee;
    --bg-2:      #efece4;
    --paper:     #faf8f3;
    --ink:       #0b0b0c;     /* near-black, never pure */
    --ink-2:     #4a4a4f;
    --mute:      #9a9a9d;
    --line:      rgba(11,11,12,0.10);
    --line-soft: rgba(11,11,12,0.06);
    --accent:    #006940;
    --accent-l:  #00bd74;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg-1);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink); overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11", "tnum";
  }

  .card {
    position: relative;
    width: 1200px; height: 630px;
    padding: 36px 56px 30px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(800px 600px at 100% 0%, rgba(0,105,64,0.06), transparent 60%),
      radial-gradient(700px 500px at 0% 100%, rgba(255,255,255,0.55), transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }

  /* Soft printed-paper grain — barely there */
  .grain {
    position: absolute; inset: 0;
    pointer-events: none; opacity: 0.05; z-index: 1;
    mix-blend-mode: multiply;
  }

  /* === Top bar: status pip · hairline · issue label === */
  .topbar {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
  }
  .pip {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(0,105,64,0.10);
    flex: none;
  }
  .topbar .label {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink);
  }
  .topbar .rule { flex: 1; height: 1px; background: var(--line); }
  .topbar .right {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-2);
  }

  /* === Body: two columns — type left, dial right === */
  .body {
    position: relative; z-index: 3; flex: 1;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 40px;
    padding-top: 38px;
    align-items: start;
  }

  .typeblock { padding-right: 8px; max-width: 760px; }

  .headline {
    font-family: "Inter", sans-serif;
    font-weight: 800;
    font-size: 132px;
    line-height: 0.94;
    letter-spacing: -0.045em;
    color: var(--ink);
    text-transform: lowercase;
    font-feature-settings: "ss01", "cv11", "tnum";
  }
  .headline.size-m  { font-size: 116px; }
  .headline.size-s  { font-size: 100px; }
  .headline.size-xs { font-size: 88px;  }

  .headline .ink { color: var(--accent); }

  .deck {
    margin-top: 22px;
    font-size: 21px; font-weight: 400;
    line-height: 1.4; letter-spacing: -0.005em;
    color: var(--ink-2);
    max-width: 620px;
  }

  /* === Compass dial (anchor visual) === */
  .dial {
    position: relative;
    width: 360px; height: 360px;
    margin-left: auto;
    margin-top: 8px;
  }
  .dial svg { width: 100%; height: 100%; display: block; }

  /* === Spec sheet === */
  .spec {
    position: relative; z-index: 3;
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 28px;
    align-items: end;
  }
  .spec .col .k {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--mute);
  }
  .spec .col .v {
    margin-top: 8px;
    font-family: "Inter", sans-serif;
    font-size: 17px; font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--ink);
    font-feature-settings: "tnum", "ss01";
  }

  /* Brand cell on the far right of the spec row */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 32px; height: 32px; flex: none; display: block; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name {
    font-family: "Inter", sans-serif;
    font-size: 16px; font-weight: 700;
    letter-spacing: -0.012em;
    color: var(--ink);
  }
  .brand .name .dot { color: var(--accent); }
  .brand .sub {
    margin-top: 4px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 9px; font-weight: 600;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--mute);
  }
</style>
</head>
<body>
<main class="card">

  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0 0.05  0 0 0 0.6 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="topbar">
    <span class="pip"></span>
    <span class="label">Field Report</span>
    <span class="rule"></span>
    <span class="right">{{ISSUE}}</span>
  </div>

  <section class="body">
    <div class="typeblock">
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="deck">{{DECK}}</p>
    </div>

    <div class="dial" aria-hidden="true">
      <svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="dialFace" cx="50%" cy="42%" r="60%">
            <stop offset="0%"  stop-color="#ffffff"/>
            <stop offset="60%" stop-color="#faf8f3"/>
            <stop offset="100%" stop-color="#ece8de"/>
          </radialGradient>
          <radialGradient id="dialGloss" cx="38%" cy="30%" r="40%">
            <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Base disc with gradient face -->
        <circle cx="180" cy="180" r="170" fill="url(#dialFace)" stroke="rgba(11,11,12,0.10)" stroke-width="1"/>
        <circle cx="180" cy="180" r="170" fill="url(#dialGloss)"/>

        <!-- Inner concentric rings -->
        <circle cx="180" cy="180" r="148" fill="none" stroke="rgba(11,11,12,0.10)" stroke-width="1"/>
        <circle cx="180" cy="180" r="120" fill="none" stroke="rgba(11,11,12,0.07)" stroke-width="1"/>
        <circle cx="180" cy="180" r="86"  fill="none" stroke="rgba(11,11,12,0.06)" stroke-width="1"/>

        <!-- 12 tick marks. Cardinal ticks longer + darker. -->
        <g stroke="rgba(11,11,12,0.32)" stroke-width="1.4" stroke-linecap="round">
          <!-- N (12 o'clock) -->
          <line x1="180" y1="22"  x2="180" y2="44"/>
          <!-- E (3) -->
          <line x1="338" y1="180" x2="316" y2="180"/>
          <!-- S (6) -->
          <line x1="180" y1="338" x2="180" y2="316"/>
          <!-- W (9) -->
          <line x1="22"  y1="180" x2="44"  y2="180"/>
        </g>
        <g stroke="rgba(11,11,12,0.18)" stroke-width="1" stroke-linecap="round">
          <!-- 1, 2, 4, 5, 7, 8, 10, 11 -->
          <line x1="259" y1="35.7" x2="252.5" y2="47"/>
          <line x1="324" y1="100"  x2="313"   y2="106.5"/>
          <line x1="324" y1="260"  x2="313"   y2="253.5"/>
          <line x1="259" y1="324"  x2="252.5" y2="313"/>
          <line x1="101" y1="324"  x2="107.5" y2="313"/>
          <line x1="36"  y1="260"  x2="47"    y2="253.5"/>
          <line x1="36"  y1="100"  x2="47"    y2="106.5"/>
          <line x1="101" y1="35.7" x2="107.5" y2="47"/>
        </g>

        <!-- North accent pip -->
        <circle cx="180" cy="36" r="6" fill="#006940"/>
        <circle cx="180" cy="36" r="11" fill="none" stroke="rgba(0,105,64,0.18)" stroke-width="1"/>

        <!-- Center hub -->
        <circle cx="180" cy="180" r="6" fill="#0b0b0c"/>
        <circle cx="180" cy="180" r="14" fill="none" stroke="rgba(11,11,12,0.18)" stroke-width="1"/>

        <!-- Needle pointing roughly N-NE — quiet, asymmetric -->
        <g transform="rotate(20 180 180)">
          <polygon points="180,40 184,180 176,180" fill="#0b0b0c" opacity="0.85"/>
          <polygon points="180,320 183,180 177,180" fill="rgba(11,11,12,0.25)"/>
        </g>
        <circle cx="180" cy="180" r="3.5" fill="#faf8f3"/>

        <!-- Cardinal labels -->
        <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="rgba(11,11,12,0.55)" letter-spacing="1">
          <text x="180" y="64"  text-anchor="middle">N</text>
          <text x="298" y="184" text-anchor="middle">E</text>
          <text x="180" y="304" text-anchor="middle">S</text>
          <text x="62"  y="184" text-anchor="middle">W</text>
        </g>
      </svg>
    </div>
  </section>

  <div class="spec">
    <div class="col">
      <div class="k">Topic</div>
      <div class="v">{{TOPIC}}</div>
    </div>
    <div class="col">
      <div class="k">Duration</div>
      <div class="v">{{DURATION}}</div>
    </div>
    <div class="col">
      <div class="k">Published</div>
      <div class="v">{{PUBLISHED}}</div>
    </div>
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
  </div>

</main>
</body>
</html>
