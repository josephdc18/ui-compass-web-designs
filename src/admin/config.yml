# =============================================================================
# DECAP CMS CONFIGURATION
# =============================================================================
# SETUP REQUIRED: Update the values marked with [CHANGE] before deploying
# =============================================================================

backend:
  name: github
  repo: josephdc18/ui-compass-web-designs  # [CHANGE] e.g., username/my-site
  branch: main
  base_url: https://uicompass.com          # [CHANGE] Your production domain
  auth_endpoint: /api/auth                   # Points to Cloudflare Function OAuth proxy
  site_domain: uicompass.com                 # Helps Decap identify the production site during OAuth

# Editorial workflow: clicking "Save" on an in-progress post commits to a
# draft branch (Draft → In Review → Ready columns under the Workflow tab),
# so half-finished edits survive closing the tab or switching devices.
publish_mode: editorial_workflow

# Enable local backend for development (run: npx decap-server)
local_backend: true

# Media settings
media_folder: 'src/assets/images/uploads'  # Where uploaded files are stored
public_folder: '/assets/images/uploads'    # Public path to uploaded files

# =============================================================================
# COLLECTIONS
# =============================================================================

collections:
  # ---------------------------------------------------------------------------
  # BLOG POSTS
  # Field names below MUST match the frontmatter keys read by
  # src/_layouts/blog-post.html (blogTitle, pageName, blogDescription, etc.).
  # Renaming any of these requires updating the layout in lockstep.
  # ---------------------------------------------------------------------------
  - name: 'blog'
    label: 'Blog Posts'
    label_singular: 'Blog Post'
    folder: 'src/blog'
    create: true
    slug: '{{fields.pageName}}'
    sortable_fields: ['date', 'updated', 'blogTitle']
    editor:
      preview: true
    description: |
      Welcome! To create a new post, click **New Blog Post** above — or open an existing post, click the **⋮ menu** in the top right, and choose **Duplicate** to start from a copy of a post that's close to what you want. The Title, Page Address, Google Search Summary, and Body are the only fields you really need to fill — everything else has sensible defaults or is optional.

      Hitting Save puts your work-in-progress in the **Workflow** tab (Draft → In Review → Ready); nothing reaches the live site until you click **Publish** from there. Pictures: paste or drag them straight into the Body — they upload automatically. The live preview on the right updates as you type.
    view_filters:
      - label: 'Live on site'
        field: draft
        pattern: false
      - label: 'Hidden from site'
        field: draft
        pattern: true
      - label: 'Featured'
        field: tags
        pattern: featured
    fields:
      # ---- Visibility (placed first so authors see it before they start writing) ----
      - label: 'Hide From Live Site'
        name: 'draft'
        widget: 'boolean'
        default: false
        hint: >-
          Leave OFF for normal publishing — the post will appear on the live site once you publish it from the Workflow tab. Turn ON to keep this post hidden from the live blog index, search, and RSS even after publish (you'll still see it locally and in the CMS). Useful for archived posts and seasonal content.

      - label: 'Title'
        name: 'blogTitle'
        widget: 'string'
        hint: >-
          The big headline at the top of the post. Example: 5 Signs You Are Ready for a Website. Keep it under about 65 characters so Google doesn't cut it off.

      - label: 'Page Address'
        name: 'pageName'
        widget: 'string'
        pattern: ['^[a-z0-9-]+$', "Use lowercase letters, numbers, and dashes only — no spaces. Example: my-first-post"]
        hint: >-
          The web address part. Lowercase, dashes instead of spaces. Example: 5-signs-ready-for-a-website becomes /blog/5-signs-ready-for-a-website/. Don't change this after publishing — old links will break.

      - label: 'Browser Tab Title'
        name: 'titleTag'
        widget: 'string'
        required: false
        hint: >-
          Optional. The shorter title that shows in the browser tab and in Google search results. If empty, the post title above is used. Example: Ready for a Website?

      - label: 'Google Search Summary'
        name: 'blogDescription'
        widget: 'text'
        hint: >-
          The 1–2 sentence summary Google shows under the post in search results. Example: Five signals that mean the time is now and two that mean wait. Aim for 150–160 characters.

      # ---- Author ----
      - label: 'Author Name'
        name: 'author'
        widget: 'string'
        default: 'UI Compass'
        hint: >-
          Who wrote the post. Defaults to UI Compass for company-voice posts. Use a real name for personal posts. Example: Joseph C.

      - { label: 'Author Avatar', name: 'authorImage', widget: 'image', required: false, hint: 'Optional. Small circular photo next to the byline. A square image works best — it gets cropped to a circle.' }

      - label: 'Author Link'
        name: 'authorUrl'
        widget: 'string'
        required: false
        hint: >-
          Optional. Makes the author's name clickable. Use /about/ to link to your About page, or a full https://… link to an external profile.

      # ---- Dates ----
      - label: 'Publish Date'
        name: 'date'
        widget: 'datetime'
        default: '{{now}}'
        hint: >-
          When the post was first published. Defaults to right now. Don't change this after publishing — it controls the post's URL ordering and "recently published" lists.

      - label: 'Last Updated'
        name: 'updated'
        widget: 'datetime'
        required: false
        hint: >-
          Optional. Fill in only when you significantly revise a published post. The byline will change from "May 20, 2026" to "Updated on Aug 14, 2026" with a small note showing the original date.

      # ---- Listing / preview ----
      - label: 'Topper Label'
        name: 'topper'
        widget: 'topper'
        required: false
        hint: >-
          Optional. Small uppercase label above the title in post previews. Start typing to pick an existing label (Strategy / Design / Performance / SEO) or type a new one to create it. Keep it under about 20 characters.

      - label: 'Category'
        name: 'category'
        widget: 'select'
        options: ['Strategy', 'SEO', 'Performance', 'Design']
        required: true
        hint: 'Required. Used by the searchable Blog index and the category breadcrumb.'

      - { label: 'Hero Image', name: 'image', widget: 'image', required: false, hint: 'The big background image at the top of the post AND the thumbnail in post previews. PNG or JPG. Aim for ~1600×900 pixels. Paste or drag an image straight in.' }

      - label: 'Hero Image Description'
        name: 'imageAlt'
        widget: 'string'
        required: false
        hint: >-
          Describe what's in the hero image for screen readers and people with images turned off. Required if you set a Hero Image. Example: A checklist with five items checked off in green on a desk next to a phone.

      - label: 'Tags'
        name: 'tags'
        widget: 'tagPicker'
        default: ['post']
        hint: >-
          Always include 'post'. Tags describe topics and power internal content tools; Category controls the Blog index filter. Click a chip's × to remove. Type to filter existing tags, press Enter to create a new one. Lowercase only — use dashes for spaces (e.g. service-by-location).

      # ---- Optional in-post components ----
      - label: 'Summary'
        name: 'summary'
        widget: 'text'
        required: false
        hint: >-
          Optional short paragraph shown above the Key Takeaways box. Like a TL;DR for the TL;DR. **Bold** and [links](/) work here.

      - label: 'Key Takeaways — Heading'
        name: 'tldrTitle'
        widget: 'string'
        required: false
        default: 'Key Takeaways'
        hint: >-
          The heading above the Key Takeaways box. Defaults to "Key Takeaways". Other examples: Five signs you are ready, What you need to know.

      - label: 'Key Takeaways — Bullets'
        name: 'tldr'
        widget: 'list'
        required: false
        collapsed: true
        summary: '{{fields.point}}'
        hint: >-
          3–5 short bullets, one big idea each. Wrap the most important phrase in **double asterisks** to make it bold. Example: Your competitor has one. **Even a mediocre site beats no site at all** because Google has nothing of yours to rank.
        field: { label: 'Bullet', name: 'point', widget: 'string' }

      # ---- Body ----
      # Body sits BEFORE FAQ, Sources, and Related Guides so the editor reads in the same
      # order as the published page: hero → meta → key takeaways → body → FAQ →
      # sources → related. Matches blog-post.html.
      - label: 'Body'
        name: 'body'
        widget: 'markdown'
        hint: >-
          This is the article itself. Use the toolbar — bold, headings, bullet lists, links, images — like a Google Doc; you don't need to know markdown. Use Heading 2 for main sections and Heading 3 for sub-sections (Heading 1 is the post title, already set above). To add an image, click the image button or paste/drag one straight in — it uploads automatically. The live preview on the right shows exactly how it will look published.

      # ---- Below-body components (mirror the published page order) ----
      - label: 'FAQ'
        name: 'faq'
        widget: 'list'
        required: false
        collapsed: true
        summary: '{{fields.q}}'
        hint: >-
          Optional Q&A list at the bottom of the post. It also emits valid FAQPage structured data. Use 3–6 concise questions when they genuinely help readers.
        fields:
          - label: 'Question'
            name: 'q'
            widget: 'string'
            hint: 'Phrase it the way a customer would Google it. Example: How small is too small for a website?'
          - label: 'Answer'
            name: 'a'
            widget: 'markdown'
            buttons: ['bold', 'italic', 'link']
            editor_components: []
            hint: >-
              Answer in 2–4 sentences. Use the toolbar for bold, italics, and links. Paragraph breaks happen automatically when you press Enter twice.

      - label: 'Sources'
        name: 'sources'
        widget: 'list'
        required: false
        collapsed: true
        summary: '{{fields.label}}'
        hint: 'Primary sources for factual claims. Only HTTPS URLs are published.'
        fields:
          - { label: 'Label', name: 'label', widget: 'string' }
          - { label: 'URL', name: 'url', widget: 'string' }
          - label: 'Link relationship'
            name: 'rel'
            widget: 'select'
            required: false
            options: ['nofollow', 'ugc', 'sponsored']

      - label: 'Related Guides'
        name: 'related'
        widget: 'relation'
        collection: 'blog'
        value_field: 'pageName'
        search_fields: ['blogTitle', 'pageName']
        display_fields: ['blogTitle']
        multiple: true
        min: 0
        max: 4
        required: false
        filters:
          - field: draft
            values: [false]
        hint: >-
          Pick 2–4 related posts. Type to search by title. Only live posts are shown — hidden posts can't be linked. The post's title and URL are auto-resolved at build time, so they always stay in sync with the target post even if it gets renamed. Linking related posts helps Google understand your site's topic clusters.

  # ---------------------------------------------------------------------------
  # SITE SETTINGS
  # ---------------------------------------------------------------------------
  - name: 'settings'
    label: 'Site Settings'
    files:
      - name: 'general'
        label: 'General Settings'
        file: 'src/_data/client.json'
        fields:
          - { label: 'Business Name', name: 'name', widget: 'string' }
          - { label: 'Email', name: 'email', widget: 'string' }
          - { label: 'Phone', name: 'phone', widget: 'string' }
          - { label: 'Phone (Formatted)', name: 'phoneFormatted', widget: 'string' }
          - label: 'Address'
            name: 'address'
            widget: 'object'
            fields:
              - { label: 'Street', name: 'lineOne', widget: 'string' }
              - { label: 'City', name: 'city', widget: 'string' }
              - { label: 'State', name: 'county', widget: 'string' }
              - { label: 'Zip', name: 'postcode', widget: 'string' }
              - { label: 'Map Link', name: 'mapLink', widget: 'string' }
          - { label: 'Domain', name: 'domain', widget: 'string' }
