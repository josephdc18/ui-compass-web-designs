<!doctype html>
<!--
  blog-card-metrics.html  (1200×630)
  Use for: posts that pivot on a small set of measurable values
  (e.g. Core Web Vitals: LCP / INP / CLS).
  Tokens:
    {{DATE}}                      — pill text
    {{M1_VAL}} {{M1_LABEL}}       — first metric value + small caps label
    {{M2_VAL}} {{M2_LABEL}}       — second
    {{M3_VAL}} {{M3_LABEL}}       — third (this one is filled green by default)
    {{HEADLINE}}                  — wrap accent word in <span class="accent">…</span>
    {{FOOTER}}                    — small caps meta line
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Metrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1411; --bg-2: #1a221d;
    --cream: #e6d9c7; --primary: #006940; --primary-light: #00bd74;
    --on-dark: #fafbfc; --on-dark-fade: rgba(255,255,255,0.66);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--on-dark); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 40px 64px 48px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 600px at 50% -20%, rgba(0,189,116,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }

  .date-pill {
    align-self: flex-start;
    padding: 10px 18px;
    background: var(--cream); border-radius: 10px;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #262421;
  }

  .metrics {
    margin: 26px 0 24px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 36px; align-items: start;
  }
  .metric { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .metric .label {
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--on-dark-fade);
    min-height: 1em;
  }
  .ring {
    width: 200px; height: 200px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.40);
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    font-weight: 900;
    font-size: 52px;
    letter-spacing: -0.02em;
    color: var(--on-dark);
    position: relative;
  }
  .ring::before {
    content: ""; position: absolute; inset: 14px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
  }
  .metric.active .ring {
    background: var(--primary);
    border-color: var(--primary-light);
    color: var(--on-dark);
  }
  .metric.active .ring::before { border-color: rgba(255,255,255,0.30); }

  .headline {
    margin-top: auto;
    font-weight: 900; font-size: 64px;
    line-height: 1.02; letter-spacing: -0.025em;
    color: var(--on-dark); max-width: 1000px;
  }
  .headline.size-s { font-size: 56px; }
  .accent { position: relative; display: inline-block; color: var(--on-dark); }
  .accent::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0.04em;
    height: 10px; background: var(--primary-light);
    z-index: -1; border-radius: 2px; opacity: 0.85;
  }

  .foot {
    margin-top: 28px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .foot-meta {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--on-dark-fade);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 38px; height: 38px; flex: none; display: block; }
  .brand .name { font-size: 18px; font-weight: 700; color: var(--on-dark); letter-spacing: -0.01em; }
  .brand .name .dot { color: var(--primary-light); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--on-dark-fade); }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
</style>
</head>
<body>
<main class="card">

  <div class="date-pill">{{DATE}}</div>

  <div class="metrics">
    <div class="metric">
      <div class="label">{{M1_LABEL}}</div>
      <div class="ring">{{M1_VAL}}</div>
    </div>
    <div class="metric">
      <div class="label">{{M2_LABEL}}</div>
      <div class="ring">{{M2_VAL}}</div>
    </div>
    <div class="metric active">
      <div class="label">{{M3_LABEL}}</div>
      <div class="ring">{{M3_VAL}}</div>
    </div>
  </div>

  <h1 class="headline">{{HEADLINE}}</h1>

  <div class="foot">
    <div class="foot-meta">{{FOOTER}}</div>
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
  </div>

</main>
</body>
</html>
