<!doctype html>
<!--
  blog-card-editorial.html  (1200×630)
  Editorial / magazine-cover variant. Designed to feel like a journal spread.
  Composition: hairline frame · small kicker · giant Playfair-italic display
  headline · hand-drawn accent underline · ghost numeral floating behind ·
  italic pull-quote · orbital fragment sliced into the bottom-right.

  Tokens:
    {{ISSUE}}        — small caps top-left, e.g. "Issue Nº 18 · May 2026"
    {{KICKER}}       — small caps section, e.g. "PERFORMANCE — Field study"
    {{HEADLINE}}     — short editorial sentence. Wrap accented word in
                       <span class="ink">…</span> to flip it from italic-green
                       to dark roman; wrap the underlined word in
                       <span class="mark">…</span>.
    {{GHOST}}        — giant ghost numeral or symbol behind the headline,
                       e.g. "10×", "№18", "0.8s". Keep it 2-4 chars.
    {{PULL}}         — italic pull-quote line under the headline.
    {{FOOTER}}       — small caps meta, e.g. "Performance · 7 min read".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:        #f7f2ea;
    --bg-2:        #efe7d8;
    --paper-tint:  #e9dfcc;
    --cream:       #e6d9c7;
    --primary:     #006940;
    --primary-l:   #00bd74;
    --primary-d:   #004a2d;
    --header:      #1f1c19;
    --body:        #4e4b66;
    --muted:       #8a8474;
    --hairline:    rgba(31,28,25,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg-1);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }

  .card {
    position: relative;
    width: 1200px; height: 630px;
    padding: 32px 56px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 92% 110%, rgba(0,105,64,0.10), transparent 60%),
      radial-gradient(700px 600px at -8% -10%, rgba(230,217,199,0.55), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }

  /* === Subtle paper grain, drawn once via SVG turbulence === */
  .grain {
    position: absolute; inset: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
    opacity: 0.18;
    z-index: 1;
  }

  /* === Top hairline meta strip === */
  .strip {
    display: flex; align-items: center; gap: 18px;
    position: relative; z-index: 3;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--hairline);
  }
  .strip .lead {
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 500;
    font-size: 17px; color: var(--header);
    letter-spacing: 0.01em;
  }
  .strip .rule {
    flex: 1; height: 1px; background: var(--hairline);
  }
  .strip .right {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--muted);
  }

  /* === Body === */
  .body {
    position: relative; z-index: 3;
    flex: 1;
    padding: 40px 0 32px;
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 36px;
    align-items: start;
  }

  /* Vertical kicker on the left edge */
  .kicker {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--primary);
    padding: 0 4px;
    border-left: 2px solid var(--primary);
    align-self: stretch;
  }

  /* Headline + extras */
  .stage {
    position: relative;
    padding-right: 80px;
  }

  /* Ghost numeral, sits behind the headline */
  .ghost {
    position: absolute;
    right: -90px; top: -34px;
    font-family: "Playfair Display", "Times New Roman", serif;
    font-style: italic; font-weight: 700;
    font-size: 360px; line-height: 0.78;
    letter-spacing: -0.05em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(0,105,64,0.18);
    user-select: none;
    z-index: 0;
    white-space: nowrap;
  }

  .headline {
    position: relative; z-index: 2;
    font-family: "Playfair Display", "Times New Roman", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 116px;
    line-height: 0.94;
    letter-spacing: -0.03em;
    color: var(--primary);
    max-width: 920px;
  }
  .headline.size-m  { font-size: 100px; }
  .headline.size-s  { font-size: 86px;  }
  .headline.size-xs { font-size: 72px;  }

  /* Switch a span back to upright dark-ink for editorial contrast */
  .ink {
    font-style: normal;
    font-weight: 900;
    font-family: "Roboto", sans-serif;
    color: var(--header);
    letter-spacing: -0.035em;
  }

  /* Hand-drawn underline under a single word/phrase */
  .mark {
    position: relative;
    display: inline-block;
    color: inherit;
    padding-bottom: 0.05em;
  }
  .mark::after {
    content: "";
    position: absolute;
    left: -4%; right: -4%;
    bottom: -0.18em;
    height: 18px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 18' preserveAspectRatio='none'><path d='M2,12 C50,2 110,18 160,8 C210,-2 260,14 298,6' fill='none' stroke='%23006940' stroke-width='5' stroke-linecap='round'/></svg>") no-repeat center / 100% 100%;
    z-index: -1;
    opacity: 0.95;
  }

  /* Pull-quote */
  .pull {
    position: relative; z-index: 2;
    margin-top: 28px;
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 400;
    font-size: 22px; line-height: 1.4;
    color: var(--body);
    max-width: 760px;
    padding-left: 16px;
    border-left: 2px solid var(--cream);
  }

  /* Orbital fragment, bottom-right, sliced by the card edge */
  .orbit {
    position: absolute;
    right: -180px; bottom: -160px;
    width: 460px; height: 460px;
    z-index: 2;
    pointer-events: none;
  }
  .orbit svg { width: 100%; height: 100%; display: block; }

  /* === Foot === */
  .foot {
    position: relative; z-index: 3;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; }
  .brand .name {
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 600;
    font-size: 19px; color: var(--header); letter-spacing: 0.005em;
  }
  .brand .name .dot { color: var(--primary); }
  .brand .sub {
    margin-top: 2px;
    font-family: "Roboto", sans-serif;
    font-size: 9px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--muted);
  }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .foot-meta {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--header);
  }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">

  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.13  0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0.55 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="strip">
    <div class="lead">{{ISSUE}}</div>
    <div class="rule"></div>
    <div class="right">UI Compass — Journal</div>
  </div>

  <section class="body">
    <div class="kicker">{{KICKER}}</div>

    <div class="stage">
      <div class="ghost" aria-hidden="true">{{GHOST}}</div>
      <h1 class="headline">{{HEADLINE}}</h1>
      <p class="pull">{{PULL}}</p>
    </div>
  </section>

  <div class="orbit" aria-hidden="true">
    <svg viewBox="0 0 460 460" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="230" cy="230" r="220" stroke="#006940" stroke-width="1.2" opacity="0.40"/>
      <circle cx="230" cy="230" r="170" stroke="#006940" stroke-width="1.2" opacity="0.30"/>
      <circle cx="230" cy="230" r="120" stroke="#006940" stroke-width="1.2" opacity="0.22"/>
      <circle cx="230" cy="230" r="70"  stroke="#006940" stroke-width="1.2" opacity="0.18"/>
      <circle cx="448" cy="222" r="9"  fill="#006940"/>
      <circle cx="124" cy="416" r="9"  fill="#006940"/>
      <circle cx="320" cy="372" r="6"  fill="#00bd74"/>
      <circle cx="372" cy="106" r="5"  fill="#e6d9c7"/>
    </svg>
  </div>

  <div class="foot">
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs · Journal</span>
      </div>
    </div>
    <div class="foot-meta">{{FOOTER}}</div>
  </div>

</main>
</body>
</html>
