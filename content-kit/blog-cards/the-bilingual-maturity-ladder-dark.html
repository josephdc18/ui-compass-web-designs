<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — The Bilingual Maturity Ladder (Dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:#0d1411; --bg-2:#1a221d;
    --cream:#2a2e25; --cream-deep:rgba(250,251,252,0.30);
    --primary:#00bd74; --primary-l:#00bd74;
    --header:#fafbfc; --body:rgba(250,251,252,0.75); --muted:rgba(250,251,252,0.45);
    --hairline:rgba(250,251,252,0.20);
    --line-soft:rgba(250,251,252,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg-1);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 24px 56px 22px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 92% 110%, rgba(0,189,116,0.16), transparent 60%),
      radial-gradient(700px 600px at -8% -10%, rgba(0,189,116,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.10; z-index: 1; }

  .strip { position: relative; z-index: 3; display: flex; align-items: center; gap: 18px; }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue { font-family: "Playfair Display", serif; font-style: italic; font-weight: 500; font-size: 17px; color: var(--header); }

  .body {
    position: relative; z-index: 3; flex: 1;
    padding-top: 24px;
    display: grid; grid-template-columns: 480px 1fr; gap: 36px;
    align-items: center; min-height: 0;
  }

  .hero { display: flex; flex-direction: column; min-width: 0; }
  .headline {
    font-family: "Playfair Display", "Times New Roman", serif;
    font-weight: 600;
    font-size: 72px; line-height: 1.02; letter-spacing: -0.022em;
    color: var(--header);
  }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }
  .subhead {
    margin-top: 18px;
    font-size: 21px; line-height: 1.4;
    color: var(--body); max-width: 440px;
  }
  .stripe { margin-top: 24px; display: flex; gap: 6px; width: 180px; }
  .stripe span { flex: 1; height: 5px; border-radius: 3px; }
  .stripe span:nth-child(1) { background: var(--primary); }
  .stripe span:nth-child(2) { background: var(--cream-deep); }
  .stripe span:nth-child(3) { background: var(--primary-l); }

  /* === Ladder/staircase visualization === */
  .ladder { width: 100%; max-width: 640px; margin-left: auto; }
  .ladder svg { width: 100%; height: auto; display: block; }

  /* === Unified footer === */
  .foot {
    position: relative; z-index: 3;
    padding-top: 12px; margin-top: 12px;
    border-top: 1px solid var(--hairline);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; filter: brightness(0) invert(1); opacity: 0.92; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name { font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 19px; color: var(--header); }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .foot-meta { font-size: 11px; font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase; color: var(--header); }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">

  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 0.98  0 0 0 0.45 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="strip">
    <span class="rule"></span>
    <span class="issue">Issue Nº 9 · November 2025</span>
  </div>

  <section class="body">

    <div class="hero">
      <h1 class="headline">Five rungs to <em>bilingual</em>.</h1>
      <p class="subhead">A maturity ladder for English/Spanish sites in the DFW market.</p>
      <div class="stripe"><span></span><span></span><span></span></div>
    </div>

    <div class="ladder" role="img" aria-label="Five ascending steps from Translated to Native, with Native highlighted">
      <svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#00bd74"/>
            <stop offset="100%" stop-color="#00bd74"/>
          </linearGradient>
        </defs>

        <!-- Ground rule -->
        <line x1="20" y1="390" x2="620" y2="390" stroke="rgba(31,28,25,0.18)" stroke-width="1.2"/>

        <!-- Stage 1: Translated -->
        <rect x="40"  y="324" width="100" height="66"  rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(250,251,252,0.22)" stroke-width="1.4"/>
        <text x="90"  y="313" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="26" fill="#8a8474">01</text>
        <text x="90"  y="364" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">TRANSLATED</text>

        <!-- Stage 2: Localized -->
        <rect x="160" y="276" width="100" height="114" rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(250,251,252,0.22)" stroke-width="1.4"/>
        <text x="210" y="265" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="30" fill="#8a8474">02</text>
        <text x="210" y="340" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">LOCALIZED</text>

        <!-- Stage 3: Cultural -->
        <rect x="280" y="222" width="100" height="168" rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(250,251,252,0.22)" stroke-width="1.4"/>
        <text x="330" y="211" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="34" fill="#8a8474">03</text>
        <text x="330" y="312" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">CULTURAL</text>

        <!-- Stage 4: Operational -->
        <rect x="400" y="162" width="100" height="228" rx="6" fill="rgba(31,28,25,0.06)" stroke="rgba(250,251,252,0.22)" stroke-width="1.4"/>
        <text x="450" y="151" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="38" fill="#8a8474">04</text>
        <text x="450" y="280" text-anchor="middle" font-family="Roboto" font-weight="700" font-size="12" letter-spacing="2.4" fill="#1f1c19">OPERATIONAL</text>

        <!-- Stage 5: Native (active) -->
        <rect x="520" y="92" width="100" height="298" rx="6" fill="url(#active)" stroke="#00bd74" stroke-width="1.4"/>
        <text x="570" y="82" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-weight="600" font-size="42" fill="#00bd74">05</text>
        <text x="570" y="248" text-anchor="middle" font-family="Roboto" font-weight="800" font-size="13" letter-spacing="2.6" fill="#faf7f4">NATIVE</text>

        <!-- Bottom axis labels -->
        <text x="40"  y="416" font-family="Roboto" font-weight="700" font-size="10" letter-spacing="2" fill="#8a8474">ENGLISH ONLY</text>
        <text x="620" y="416" text-anchor="end" font-family="Roboto" font-weight="700" font-size="10" letter-spacing="2" fill="#00bd74">FULLY BILINGUAL</text>
      </svg>
    </div>

  </section>

  <div class="foot">
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="foot-meta">Strategy<span class="dot">•</span>9 min read</div>
  </div>

</main>
</body>
</html>
