<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UI Compass — Joseph Clutts Business Card</title>
<style>
  :root {
    --primary: #00bd74;
    --primary-deep: #006940;
    --primary-logo: #41925b;
    --dark: #0d1411;
    --medium: #1a221d;
    --surface: #11181436;
    --line: rgba(0, 189, 116, 0.18);
    --text: #fafbfc;
    --muted: #a8b3ad;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: "Roboto", "Lato", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 20% 0%, rgba(0,189,116,0.06), transparent 60%),
      radial-gradient(1200px 600px at 100% 100%, rgba(0,105,64,0.08), transparent 60%),
      #0a0f0d;
    min-height: 100vh;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 64px 24px;
  }

  .label {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    text-align: center;
    font-weight: 600;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 56px;
    justify-content: center;
    align-items: center;
  }

  .card-wrap { display: flex; flex-direction: column; align-items: center; }

  /* Standard business card 3.5" x 2" — rendered at ~96dpi */
  .card {
    width: 350px;
    height: 200px;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, 0.6),
      0 12px 24px -10px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.04);
    font-family: inherit;
    color: var(--text);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ============ FRONT ============ */
  .front {
    background:
      radial-gradient(420px 220px at 100% 0%, rgba(0, 189, 116, 0.18), transparent 65%),
      radial-gradient(360px 200px at 0% 100%, rgba(65, 146, 91, 0.12), transparent 65%),
      linear-gradient(180deg, #11181b 0%, #0d1411 100%);
  }

  .front::before {
    /* subtle grid */
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at 30% 50%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 30% 50%, #000 30%, transparent 75%);
    pointer-events: none;
  }

  /* Compass rose graphic — sits on right side */
  .compass {
    position: absolute;
    top: 50%;
    right: -34px;
    transform: translateY(-50%);
    width: 200px;
    height: 200px;
    opacity: 0.95;
    pointer-events: none;
  }

  .compass .ring {
    fill: none;
    stroke: rgba(0, 189, 116, 0.22);
    stroke-width: 1;
  }
  .compass .ring-outer { stroke: rgba(0, 189, 116, 0.32); }
  .compass .tick { stroke: rgba(0, 189, 116, 0.45); stroke-width: 1; }
  .compass .tick-major { stroke: rgba(0, 189, 116, 0.7); stroke-width: 1.5; }
  .compass .needle-n { fill: var(--primary); }
  .compass .needle-s { fill: rgba(255, 255, 255, 0.18); }
  .compass .center { fill: var(--dark); stroke: var(--primary); stroke-width: 1.5; }
  .compass .cardinal {
    fill: rgba(168, 179, 173, 0.55);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    font-family: "Roboto", sans-serif;
  }
  .compass .cardinal-n { fill: var(--primary); }

  .front-content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 22px 24px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: #ffffff;
    box-shadow: 0 4px 12px -2px rgba(0, 189, 116, 0.5);
  }

  .brand-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  .brand-name span { color: var(--primary); }

  .identity { margin-top: auto; max-width: 220px; }

  .name {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.1;
    color: var(--text);
  }

  .role {
    margin: 6px 0 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--primary);
  }
  .role .sep { color: rgba(0, 189, 116, 0.4); margin: 0 6px; }

  .accent-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 64px;
    background: linear-gradient(90deg, var(--primary), transparent);
  }

  /* ============ BACK ============ */
  .back {
    background:
      radial-gradient(380px 220px at 0% 0%, rgba(0, 189, 116, 0.14), transparent 65%),
      linear-gradient(180deg, #0d1411 0%, #0a100d 100%);
  }

  .back::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse at 80% 80%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at 80% 80%, #000 30%, transparent 80%);
    pointer-events: none;
  }

  .back-watermark {
    position: absolute;
    right: -40px;
    bottom: -40px;
    width: 220px;
    height: 220px;
    opacity: 0.07;
    pointer-events: none;
  }

  .back-content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .back-tagline {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--primary);
  }

  .back-headline {
    margin: 6px 0 0;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text);
    max-width: 260px;
  }
  .back-headline em {
    font-style: normal;
    color: var(--primary);
  }

  .contacts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 18px;
    margin-top: 12px;
  }

  .contact {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    color: var(--text);
    line-height: 1.2;
  }

  .contact .ic {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(0, 189, 116, 0.12);
    border: 1px solid rgba(0, 189, 116, 0.28);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .contact .ic svg { width: 11px; height: 11px; stroke: var(--primary); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .contact .val {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .contact .key {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .contact .v { font-size: 11px; font-weight: 600; color: var(--text); white-space: nowrap; }

  .back-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(0, 189, 116, 0.18);
    padding-top: 8px;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .back-foot strong { color: var(--primary); font-weight: 700; }

  /* Print: one card per page, center it */
  @media print {
    body { background: #ffffff; }
    .stage { padding: 0; gap: 0; min-height: auto; }
    .row { gap: 0; flex-direction: column; }
    .label, .card-wrap .label { display: none; }
    .card {
      width: 3.5in;
      height: 2in;
      box-shadow: none;
      border-radius: 0;
      page-break-after: always;
      break-after: page;
    }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="row">
      <div class="card-wrap">
        <div class="label">Front</div>
        <article class="card front" aria-label="Business card front">
          <svg class="compass" viewBox="0 0 200 200" aria-hidden="true">
            <!-- rings -->
            <circle class="ring ring-outer" cx="100" cy="100" r="86"/>
            <circle class="ring" cx="100" cy="100" r="72"/>
            <circle class="ring" cx="100" cy="100" r="54"/>

            <!-- ticks: 24 marks around outer ring -->
            <g>
              <!-- generated tick marks every 15deg -->
              <g stroke-linecap="round">
                <!-- major: N E S W -->
                <line class="tick-major" x1="100" y1="14"  x2="100" y2="26"/>
                <line class="tick-major" x1="186" y1="100" x2="174" y2="100"/>
                <line class="tick-major" x1="100" y1="186" x2="100" y2="174"/>
                <line class="tick-major" x1="14"  y1="100" x2="26"  y2="100"/>

                <!-- minor diagonals (NE, SE, SW, NW) -->
                <line class="tick" x1="160.81" y1="39.19" x2="152.32" y2="47.68"/>
                <line class="tick" x1="160.81" y1="160.81" x2="152.32" y2="152.32"/>
                <line class="tick" x1="39.19"  y1="160.81" x2="47.68"  y2="152.32"/>
                <line class="tick" x1="39.19"  y1="39.19"  x2="47.68"  y2="47.68"/>

                <!-- 15 / 30 / 60 / 75 degree ticks -->
                <line class="tick" x1="122.25" y1="16.93"  x2="119.41" y2="28.59"/>
                <line class="tick" x1="143"    y1="25.72"  x2="137.5"  y2="36.5"/>
                <line class="tick" x1="174.28" y1="57"     x2="163.5"  y2="62.5"/>
                <line class="tick" x1="183.07" y1="77.75"  x2="171.41" y2="80.59"/>
                <line class="tick" x1="183.07" y1="122.25" x2="171.41" y2="119.41"/>
                <line class="tick" x1="174.28" y1="143"    x2="163.5"  y2="137.5"/>
                <line class="tick" x1="143"    y1="174.28" x2="137.5"  y2="163.5"/>
                <line class="tick" x1="122.25" y1="183.07" x2="119.41" y2="171.41"/>
                <line class="tick" x1="77.75"  y1="183.07" x2="80.59"  y2="171.41"/>
                <line class="tick" x1="57"     y1="174.28" x2="62.5"   y2="163.5"/>
                <line class="tick" x1="25.72"  y1="143"    x2="36.5"   y2="137.5"/>
                <line class="tick" x1="16.93"  y1="122.25" x2="28.59"  y2="119.41"/>
                <line class="tick" x1="16.93"  y1="77.75"  x2="28.59"  y2="80.59"/>
                <line class="tick" x1="25.72"  y1="57"     x2="36.5"   y2="62.5"/>
                <line class="tick" x1="57"     y1="25.72"  x2="62.5"   y2="36.5"/>
                <line class="tick" x1="77.75"  y1="16.93"  x2="80.59"  y2="28.59"/>
              </g>
            </g>

            <!-- needle -->
            <polygon class="needle-n" points="100,32 108,100 100,96 92,100"/>
            <polygon class="needle-s" points="100,168 108,100 100,104 92,100"/>

            <!-- center cap -->
            <circle class="center" cx="100" cy="100" r="6"/>

            <!-- cardinal letters -->
            <text class="cardinal cardinal-n" x="100" y="50" text-anchor="middle">N</text>
            <text class="cardinal" x="150" y="103" text-anchor="middle">E</text>
            <text class="cardinal" x="100" y="156" text-anchor="middle">S</text>
            <text class="cardinal" x="50"  y="103" text-anchor="middle">W</text>
          </svg>

          <div class="front-content">
            <div class="brand">
              <div class="brand-mark">UI</div>
              <div class="brand-name">UI<span>Compass</span></div>
            </div>

            <div class="identity">
              <h1 class="name">Joseph Clutts</h1>
              <p class="role">Founder<span class="sep">·</span>Web Developer</p>
            </div>
          </div>

          <div class="accent-bar" aria-hidden="true"></div>
        </article>
      </div>

      <div class="card-wrap">
        <div class="label">Back</div>
        <article class="card back" aria-label="Business card back">
          <svg class="back-watermark" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="86" fill="none" stroke="#00bd74" stroke-width="2"/>
            <circle cx="100" cy="100" r="60" fill="none" stroke="#00bd74" stroke-width="1"/>
            <polygon points="100,32 110,100 100,94 90,100" fill="#00bd74"/>
            <polygon points="100,168 110,100 100,106 90,100" fill="#00bd74" opacity="0.4"/>
            <circle cx="100" cy="100" r="6" fill="#00bd74"/>
          </svg>

          <div class="back-content">
            <div>
              <div class="back-tagline">Find your direction</div>
              <p class="back-headline">Fast, <em>SEO-first</em> websites for small businesses — built to convert.</p>
            </div>

            <div class="contacts">
              <div class="contact">
                <span class="ic" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
                </span>
                <span class="val">
                  <span class="key">Email</span>
                  <span class="v">contact@uicompass.com</span>
                </span>
              </div>

              <div class="contact">
                <span class="ic" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1a12 12 0 006 6l1-2 5 2v3a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/></svg>
                </span>
                <span class="val">
                  <span class="key">Phone</span>
                  <span class="v">(901) 490-4750</span>
                </span>
              </div>

              <div class="contact">
                <span class="ic" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
                </span>
                <span class="val">
                  <span class="key">Web</span>
                  <span class="v">uicompass.com</span>
                </span>
              </div>

              <div class="contact">
                <span class="ic" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M12 22s7-7.5 7-13a7 7 0 10-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/></svg>
                </span>
                <span class="val">
                  <span class="key">Based In</span>
                  <span class="v">Arlington, TX</span>
                </span>
              </div>
            </div>

            <div class="back-foot">
              <span><strong>UI</strong> Compass</span>
              <span>Serving anywhere</span>
            </div>
          </div>
        </article>
      </div>
    </div>
  </main>
</body>
</html>
