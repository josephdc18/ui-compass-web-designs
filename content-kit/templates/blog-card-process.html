<!doctype html>
<!--
  blog-card-process.html  (1200×630)
  Use for: posts that walk through a sequence ("crawl → render → index → rank").
  Tokens:
    {{DATE}}      — pill text, e.g. "MAR 30, 2026"
    {{S1}}..{{S4}} — short step labels, ALL CAPS preferred
    {{HEADLINE}}  — wrap accent word in <span class="accent">…</span>
    {{FOOTER}}    — small caps meta line
  The last step circle is highlighted; tweak with .step.active.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Process</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf7f4; --bg-2: #f3ede5;
    --cream: #e6d9c7; --primary: #006940; --primary-light: #00bd74;
    --header: #262421; --body: #4e4b66; --muted: #7a7889;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 48px 64px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(800px 600px at 90% -10%, rgba(0,105,64,0.08), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }

  /* Date pill */
  .date-pill {
    align-self: flex-start;
    padding: 10px 18px;
    background: var(--cream);
    border: 1px solid rgba(0,105,64,0.18);
    border-radius: 10px;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--header);
  }

  /* Steps row */
  .steps {
    margin: 36px auto 12px;
    display: flex; align-items: center; justify-content: center;
    gap: 0;
  }
  .step {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    min-width: 140px;
  }
  .step .ring {
    width: 76px; height: 76px; border-radius: 50%;
    border: 2px solid rgba(38,36,33,0.45);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    font-size: 14px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.06em;
  }
  .step.active .ring {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--bg);
  }
  .step .label {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--header);
  }
  .arrow {
    flex: 1; max-width: 80px;
    height: 2px; background: rgba(38,36,33,0.35);
    position: relative; margin: 0 -8px;
    align-self: center; transform: translateY(-12px);
  }
  .arrow::after {
    content: ""; position: absolute; right: -1px; top: 50%;
    width: 8px; height: 8px;
    border-top: 2px solid rgba(38,36,33,0.35);
    border-right: 2px solid rgba(38,36,33,0.35);
    transform: translateY(-50%) rotate(45deg);
  }

  /* Headline (bottom block) */
  .headline {
    margin-top: auto;
    font-weight: 900; font-size: 84px;
    line-height: 0.96; letter-spacing: -0.03em;
    color: var(--header); max-width: 900px;
  }
  .headline.size-s  { font-size: 72px; }
  .headline.size-xs { font-size: 60px; }
  .accent { position: relative; display: inline-block; }
  .accent::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0.04em;
    height: 12px; background: var(--primary);
    z-index: -1; border-radius: 2px; opacity: 0.85;
  }

  /* Footer */
  .foot {
    margin-top: 32px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .foot-meta {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--body);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 38px; height: 38px; flex: none; display: block; }
  .brand .name { font-size: 18px; font-weight: 700; color: var(--header); letter-spacing: -0.01em; }
  .brand .name .dot { color: var(--primary); }
  .brand .sub { margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
</style>
</head>
<body>
<main class="card">

  <div class="date-pill">{{DATE}}</div>

  <div class="steps">
    <div class="step"><div class="ring">01</div><div class="label">{{S1}}</div></div>
    <div class="arrow"></div>
    <div class="step"><div class="ring">02</div><div class="label">{{S2}}</div></div>
    <div class="arrow"></div>
    <div class="step"><div class="ring">03</div><div class="label">{{S3}}</div></div>
    <div class="arrow"></div>
    <div class="step active"><div class="ring">04</div><div class="label">{{S4}}</div></div>
  </div>

  <h1 class="headline">{{HEADLINE}}</h1>

  <div class="foot">
    <div class="foot-meta">{{FOOTER}}</div>
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
  </div>

</main>
</body>
</html>
