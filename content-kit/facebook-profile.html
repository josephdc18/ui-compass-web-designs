<!doctype html>
<!--
  facebook-profile.html  (1080×1080)

  UI Compass Web Designs — Facebook business page profile picture.
  Stacked italic wordmark in the same typographic system as the cover
  photo: Barlow Condensed 900 italic on dark green, white primary, bright
  green accent on the period.

  Facebook clips profile pictures into a circle for display, so all
  content lives inside the inscribed circle (center ~720px usable).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Compass — Facebook Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-green: #0a5f3a;
    --accent:   #4fc66f;
    --cream:    #e9e9e6;
    --ink:      #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--bg-green);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    position: relative;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* Small accent dot above the wordmark — a compass-needle marker */
  .marker {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    margin-bottom: 36px;
  }

  .word {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-style: italic;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: -0.01em;
    line-height: 0.86;
    text-align: center;
  }
  .word.ui      { font-size: 360px; }
  .word.compass { font-size: 220px; margin-top: 8px; }
  .word .dot { color: var(--accent); }

  .rule {
    width: 220px;
    height: 2px;
    background: var(--cream);
    opacity: 0.55;
    margin-top: 44px;
  }

  .tagline {
    margin-top: 30px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--cream);
  }
</style>
</head>
<body>
<main class="stage">
  <div class="marker" aria-hidden="true"></div>
  <div class="word ui">UI</div>
  <div class="word compass">Compass<span class="dot">.</span></div>
  <div class="rule" aria-hidden="true"></div>
  <div class="tagline">Web Designs</div>
</main>
</body>
</html>
