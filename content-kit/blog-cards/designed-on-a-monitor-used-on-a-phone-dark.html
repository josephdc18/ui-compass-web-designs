<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog Card — Designed Wide. Used Narrow. (Dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1:#0d1411; --bg-2:#1a221d;
    --cream:#2a2e25; --primary:#00bd74; --primary-l:#00bd74;
    --header:#fafbfc; --body:rgba(250,251,252,0.75); --muted:rgba(250,251,252,0.45);
    --hairline:rgba(250,251,252,0.20);
    --line-soft:rgba(250,251,252,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; min-height: 0; }
  html, body {
    width: 1200px; height: 630px; background: var(--bg-1);
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
    color: var(--header); overflow: hidden;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .card {
    position: relative; width: 1200px; height: 630px;
    padding: 24px 56px 22px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 700px at 92% 110%, rgba(0,189,116,0.16), transparent 60%),
      radial-gradient(700px 600px at -8% -10%, rgba(0,189,116,0.06), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    overflow: hidden;
  }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.10; z-index: 1; }

  /* === Top strip: rule + italic issue (right) — single hairline === */
  .strip {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 18px;
  }
  .strip .rule { flex: 1; height: 1px; background: var(--hairline); }
  .strip .issue {
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 500;
    font-size: 17px; color: var(--header);
  }

  /* === Body shell === */
  .body { position: relative; z-index: 3; flex: 1; padding-top: 20px; display: flex; flex-direction: column; min-height: 0; }

  .headline {
    font-family: "Playfair Display", "Times New Roman", serif;
    font-size: 54px; line-height: 1.04;
    font-weight: 600; letter-spacing: -0.02em;
    color: var(--header);
  }
  .headline em { font-style: italic; font-weight: 500; color: var(--primary); }

  /* === Comparison columns === */
  .cols {
    margin-top: 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 22px;
    align-items: stretch; flex: 1; min-height: 0;
  }
  .col {
    padding: 12px 18px 12px;
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    position: relative; min-height: 0;
  }
  .col.l { background: rgba(250,251,252,0.04); border: 1px solid var(--line-soft); }
  .col.r { background: rgba(0,189,116,0.07); border: 1px solid rgba(0,189,116,0.30); }
  .col.r::after { content: "✓"; position: absolute; top: 8px; right: 12px; font-weight: 900; font-size: 18px; color: var(--primary); }
  .col .label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); align-self: flex-start;
  }
  .col.r .label { color: var(--primary); }
  .col .device {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    width: 100%; padding: 4px 0;
  }
  .col .device svg {
    display: block; max-height: 100%; max-width: 100%;
    width: auto; height: auto;
  }
  .col .measure { font-weight: 900; font-size: 30px; letter-spacing: -0.02em; color: var(--header); line-height: 1; }
  .col.r .measure { color: var(--primary); }
  .col .desc { font-size: 13px; line-height: 1.35; color: var(--body); text-align: center; max-width: 320px; }

  .vs {
    display: flex; align-items: center; justify-content: center;
    font-family: "Playfair Display", serif; font-style: italic; font-weight: 600;
    font-size: 26px; color: var(--muted); padding: 0 4px;
  }

  /* === Bottom strip: brand left · section · min read right === */
  .foot {
    position: relative; z-index: 3;
    padding-top: 12px; margin-top: 12px;
    border-top: 1px solid var(--hairline);
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; display: block; filter: brightness(0) invert(1); opacity: 0.92; }
  .brand .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .brand .name {
    font-family: "Playfair Display", serif;
    font-style: italic; font-weight: 600;
    font-size: 19px; color: var(--header);
  }
  .brand .name .dot { color: var(--primary); }
  .brand .sub {
    margin-top: 3px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--muted);
  }
  .foot-meta {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--header);
  }
  .foot-meta .dot { color: var(--primary); margin: 0 8px; }
</style>
</head>
<body>
<main class="card">

  <svg class="grain" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1200 630" aria-hidden="true">
    <filter id="g">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.96  0 0 0 0 0.98  0 0 0 0.45 0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#g)"/>
  </svg>

  <div class="strip">
    <span class="rule"></span>
    <span class="issue">Issue Nº 21 · April 2026</span>
  </div>

  <section class="body">
    <h1 class="headline">Designed wide. <em>Used narrow.</em></h1>

    <div class="cols">
      <div class="col l">
        <div class="label">Where it's designed</div>
        <div class="device">
          <svg viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="6" y="6" width="308" height="172" rx="10" fill="#1f1c19"/>
            <rect x="14" y="14" width="292" height="156" rx="4" fill="#0e0d0a"/>
            <rect x="20" y="20" width="280" height="144" rx="2" fill="#faf7f4"/>
            <rect x="32" y="32" width="60" height="6" rx="1.5" fill="#1f1c19" opacity="0.8"/>
            <circle cx="290" cy="35" r="3" fill="#00bd74"/>
            <rect x="32" y="50" width="120" height="10" rx="2" fill="#1f1c19" opacity="0.9"/>
            <rect x="32" y="64" width="160" height="6" rx="1.5" fill="#4e4b66" opacity="0.55"/>
            <rect x="32" y="74" width="140" height="6" rx="1.5" fill="#4e4b66" opacity="0.55"/>
            <rect x="32" y="92" width="60" height="18" rx="3" fill="#00bd74"/>
            <rect x="200" y="50" width="92" height="80" rx="3" fill="#d6c4a8" opacity="0.55"/>
            <rect x="32" y="124" width="50" height="32" rx="3" fill="#e6d9c7" opacity="0.55"/>
            <rect x="88"  y="124" width="50" height="32" rx="3" fill="#e6d9c7" opacity="0.55"/>
            <rect x="144" y="124" width="50" height="32" rx="3" fill="#e6d9c7" opacity="0.55"/>
            <rect x="140" y="178" width="40" height="20" rx="2" fill="#1f1c19"/>
            <rect x="96" y="198" width="128" height="8" rx="3" fill="#1f1c19"/>
            <ellipse cx="160" cy="206" rx="64" ry="4" fill="rgba(31,28,25,0.18)"/>
          </svg>
        </div>
        <div class="measure">27 inches</div>
        <div class="desc">Desktop-first builds. Picked on a 2560-wide canvas.</div>
      </div>

      <div class="vs">vs.</div>

      <div class="col r">
        <div class="label">Where it's used</div>
        <div class="device">
          <svg viewBox="0 0 130 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="2" y="2" width="126" height="216" rx="22" fill="#1f1c19"/>
            <rect x="6" y="6" width="118" height="208" rx="19" fill="#0e0d0a"/>
            <rect x="9" y="9" width="112" height="202" rx="15" fill="#faf7f4"/>
            <rect x="48" y="6" width="34" height="9" rx="4.5" fill="#1f1c19"/>
            <rect x="16" y="24" width="98" height="14" rx="3" fill="#e6d9c7" opacity="0.8"/>
            <circle cx="22" cy="31" r="2.5" fill="#00bd74"/>
            <rect x="30" y="28" width="36" height="5" rx="1.5" fill="#1f1c19" opacity="0.7"/>
            <rect x="16" y="48" width="78" height="8" rx="2" fill="#1f1c19" opacity="0.92"/>
            <rect x="16" y="60" width="60" height="8" rx="2" fill="#1f1c19" opacity="0.92"/>
            <rect x="16" y="76" width="98" height="4" rx="1" fill="#4e4b66" opacity="0.55"/>
            <rect x="16" y="84" width="80" height="4" rx="1" fill="#4e4b66" opacity="0.55"/>
            <rect x="16" y="98" width="98" height="22" rx="11" fill="#00bd74"/>
            <rect x="40" y="106" width="50" height="6" rx="2" fill="#faf7f4"/>
            <rect x="16" y="128" width="98" height="44" rx="4" fill="#d6c4a8" opacity="0.55"/>
            <rect x="16" y="180" width="98" height="20" rx="5" fill="#00bd74" opacity="0.14"/>
            <circle cx="28" cy="190" r="5" fill="none" stroke="#00bd74" stroke-width="1.3"/>
            <rect x="38" y="187" width="50" height="6" rx="1.5" fill="#00bd74" opacity="0.85"/>
            <rect x="48" y="206" width="34" height="2.5" rx="1.25" fill="#1f1c19" opacity="0.4"/>
          </svg>
        </div>
        <div class="measure">6 inches</div>
        <div class="desc">60% of visitors. Start at 320px or rebuild later.</div>
      </div>
    </div>
  </section>

  <div class="foot">
    <div class="brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="UI Compass" data-inline-logo>
      <div class="wordmark">
        <span class="name">UI Compass<span class="dot">.</span></span>
        <span class="sub">Web Designs</span>
      </div>
    </div>
    <div class="foot-meta">Design<span class="dot">•</span>5 min read</div>
  </div>

</main>
</body>
</html>
