<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Manager</title>
</head>

<body>
  <!-- Manual init: stop Decap from auto-initializing on bundle load. We need
       a window where preview-templates.js can register custom widgets first
       (`topper`, `tagPicker`); without this, Decap renders the editor before
       those widgets exist and shows "No control for widget 'topper'". -->
  <script>window.CMS_MANUAL_INIT = true;</script>

  <!-- Decap CMS bundle (UMD; exposes window.CMS, window.h, window.createClass).
       Pinned to an exact version. Bumping requires re-running the CMS smoke
       test: every custom widget, event listener, and DOM-injection selector
       in preview-templates.js can break with any Decap release. -->
  <script src="https://unpkg.com/decap-cms@3.13.0/dist/decap-cms.js"></script>

  <!-- Live-preview templates. Registers custom widgets, then calls
       CMS.init() itself so init happens AFTER registration. -->
  <script src="/admin/preview-templates.js"></script>
</body>

</html>
